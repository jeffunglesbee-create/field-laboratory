# The Live now line on the DEPLOYED page against the relay's own live feeds read in the same minute (scripts/live-now-deployed-probe.mjs).
# CI-as-proxy: the authoring sandbox cannot reach *.workers.dev. A manifest of counts and booleans in outbox/live-now-deployed-manifest-latest.json plus a screenshot; the verdict is in the manifest.
#
# Triggers: a push of outbox/.trigger-live-now-deployed-probe, or workflow_dispatch. NO SCHEDULE: it answers one question; a monitor is a recurring
# Actions cost (CLAUDE.md, "Actions budget"). The trigger file is removed by this workflow's own commit so a later merge cannot re-fire it.
name: live-now-deployed-probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'outbox/.trigger-live-now-deployed-probe'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # browser-gate: exempt 2 -- a failed install ends the job red (no continue-on-error) before the probe runs; the probe product, its manifest, needs the browser
      - name: Install Chromium
        timeout-minutes: 3
        run: npx playwright install chromium
      - name: The probe's own logic, before it measures anything
        run: node scripts/live-now-deployed-probe.mjs --self-test
      - name: Read the deployed page against the relay
        id: probe
        continue-on-error: true
        run: |
          URL=https://field-laboratory.jeffunglesbee.workers.dev node scripts/live-now-deployed-probe.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}
      - name: Commit
        if: always()
        run: |
          git config user.email "claude@field.dev"
          git config user.name "FIELD CI"
          git rm -q --ignore-unmatch outbox/.trigger-live-now-deployed-probe
          git add outbox/live-now-deployed-probe-latest.json outbox/live-now-deployed-probe-latest.png 2>/dev/null || true
          git diff --staged --quiet && exit 0
          git commit -m "probe: the Live now line on the deployed page against the relay [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break
            sleep $((i * 5))
          done
          git fetch -q origin "${GITHUB_REF_NAME}"
          git merge-base --is-ancestor HEAD "origin/${GITHUB_REF_NAME}" \
            || { echo "FAIL: push did not land after retries"; exit 1; }
      - name: The probe's result decides the job
        if: steps.probe.outcome != 'success'
        run: |
          echo "live-now-deployed-probe did not complete: see the step summary"
          exit 1
