# Daily drift sentinel.
#
# Runs this repo's own compiled F# decoders against a live /context/date payload
# and appends the outcome to outbox/drift-log.md.
#
# The question: the decoders are proven correct and not proven necessary. This
# measures whether FIELD's live payloads actually drift. A long run of `ok` rows
# is a real result that argues the decoders are insurance nobody has claimed on —
# report it that way rather than tuning this workflow toward green.
name: drift-sentinel

on:
  schedule:
    # Daily. This is a drift detector, not a monitor; hourly would add cost and
    # no information.
    - cron: '0 12 * * *'
    # A second run at 01:30 UTC — 21:30 ET, inside the four-hour window where
    # the FIELD zone and UTC disagree. The 12:00 run is 08:00 ET, the same day
    # in both zones, so on its own it would never once exercise the date
    # handling this repo just rebuilt. This is also the busiest slate of the
    # day in ET, which makes it the most informative run, not just the most
    # awkward one.
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # The sentinel files its own follow-up when it observes a sport the Sport
  # registry does not model. An alarm nobody converts into work is a log line.
  issues: write

concurrency:
  group: drift-sentinel
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore pinned Fable and build the decoders
        run: |
          dotnet tool restore
          dotnet fable src/Laboratory.fsproj --outDir build

      - name: Run the sentinel against today's live payload
        id: sentinel
        run: |
          # FIELD's canonical zone, not UTC. Probing the UTC day between 00:00
          # and 04:00 UTC asks the relay for tomorrow's slate during ET prime
          # time — the same four-hour window the FieldDay type exists to close.
          DATE=$(TZ=America/New_York date +%F)
          URL="https://field-relay-nba.jeffunglesbee.workers.dev/context/date/$DATE"
          set +e
          node scripts/drift-check.mjs --url "$URL" | tee /tmp/out.txt
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          set -e
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          # Which venue names in today's real slate fail to find their park.
          #
          # NOT a failure condition, deliberately. Every park in the table is
          # already proven reachable at generation time; what this catches is
          # the open half — a name no imported source used, from a new stadium,
          # a rename, or a vocabulary this repo has not met. An unresolved name
          # already behaves correctly (the row stays absent rather than showing
          # another stadium's numbers), so this is a discovery signal, and
          # failing the sentinel on news about the world would train everyone
          # to ignore it.
          #
          # It lands in the drift log because that is the one file anyone reads
          # afterwards. A warning in a run log is a warning nobody sees.
          set +e
          node scripts/venue-coverage-check.mjs --report --url "$URL" | tee /tmp/venues.txt
          set -e
          VC=$(grep '^VENUE_COVERAGE ' /tmp/venues.txt | tail -1 || true)
          echo "venues=$(echo "$VC" | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          echo "unresolved=$(echo "$VC" | awk '{print $3}')" >> "$GITHUB_OUTPUT"
          # RESULT|source|status|games|malformed|note
          grep '^RESULT|' /tmp/out.txt | tail -1 > /tmp/result.txt || echo "RESULT|$URL|no-result|0|0|sentinel produced no RESULT line" > /tmp/result.txt

      # Runs even when the check failed — a red run is precisely the row worth
      # keeping, so the log must be written before the job is allowed to fail.
      # The venue table against the planet, daily.
      #
      # Every check in this repo that meets a live service does so only when
      # somebody pushes. This one has a reason to run on a clock: the venue
      # coordinates are TRANSCRIBED, the roof types were hand-reviewed from a
      # probe sequence, and playground's own caveat is that the table "can drift
      # as venues are renamed or rebuilt". A table that is right today and wrong
      # in November is exactly what a push-triggered check never notices.
      #
      # It also exercises the Open-Meteo request itself daily, so a changed
      # parameter, a revoked CORS header or a units default flipping under us is
      # caught within a day instead of at the next weather commit.
      #
      # `if: always()` so it runs whether or not the relay probe above succeeded
      # — the two services are unrelated and one being down should not hide the
      # other.
      - name: Venue table and Open-Meteo, checked live
        if: always()
        run: npm run check:weather-live

      # Did the CC-CMDs this repo filed actually land?
      #
      # Five have been filed into field-relay-nba/docs/ from here; two carry open
      # asks. Nothing checked whether any were acted on, which makes a CC-CMD a
      # wish with a commit sha. This probes for the OBSERVABLE CONSEQUENCE of
      # each ask — a route either projects a field or it does not — rather than
      # for the document, which can be read, agreed with, and never implemented.
      #
      # Non-fatal on "not yet": that is someone else's backlog, and turning it
      # into a red build here is how a check gets deleted. Fatal only when NO
      # probe could run, because "could not tell" reported as "not landed" is a
      # claim from no data.
      # Self-test first: the predicates only ever ran against the live relay,
      # where a working predicate and `landed: () => true` are indistinguishable.
      - name: Did the filed CC-CMDs land?
        if: always()
        run: |
          node scripts/cc-cmd-followup.mjs --self-test
          node scripts/cc-cmd-followup.mjs

      # The i-have-adhd skill must stay BYTE-IDENTICAL to its published source —
      # a hand-edit or a partial reconstruction is the failure the installer
      # exists to rule out. `--check` re-verifies the match on every sentinel run;
      # if raw.githubusercontent is unreachable it warns and passes (a CDN blip
      # is not this repo's drift), so the step is honest without being flaky.
      - name: The i-have-adhd skill is still verbatim
        if: always()
        run: npm run check:adhd-skill

      # Cross-repo, no PR: when the relay's soccer briefs still carry the
      # CC-CMD-2026-08-22 defects, file/update a self-closing evidence issue ON
      # field-relay-nba with the verbatim offenders. Skips cleanly if
      # SIBLING_REPO_TOKEN (issues:write on the relay) is not set, so it is safe
      # to run before the secret exists. Non-fatal — the relay's backlog must not
      # turn this job red.
      - name: File a self-closing brief-defect ticket on the relay
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPO_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/relay-brief-watch.mjs --self-test && node scripts/relay-brief-watch.mjs

      # Is the registry about to be surprised?
      #
      # The drift check above fails on an unmodelled sport, and it is right to.
      # But it learns the vocabulary from ONE DAY'S SLATE, so it can only find a
      # competition on the day that competition next plays. The drift log shows
      # what that costs: ten days, a red run each time a new competition first
      # appeared -- NFL, CFL, golf, La Liga, wnba, EFL Trophy, two UEFA
      # qualifying comps, Ligue 1, Serie A. Every one of those labels was
      # already in the relay's games table before it reached a slate.
      #
      # BLOCKING as of 44d8e5d, which closed the gap: all 26 relay labels are
      # now either modelled or a recorded Omission. From here a failure means
      # the relay started carrying a competition nobody has looked at, and that
      # should stop the run on the day it becomes true rather than on the
      # morning that competition first plays.
      - name: Sport registry covers the relay's whole vocabulary
        run: npm run check:sport-vocabulary

      - name: Append to the drift log
        if: always()
        run: |
          IFS='|' read -r _ SRC STATUS GAMES MALFORMED NOTE < /tmp/result.txt
          mkdir -p outbox
          if [ ! -f outbox/drift-log.md ]; then
            {
              echo "# Drift log"
              echo
              echo "Appended by .github/workflows/drift-sentinel.yml. One row per run."
              echo "\`status\` is \`ok\`, \`malformed\` (a nested JSON field stopped decoding),"
              echo "\`decode-failed\` (the payload shape changed), or \`fetch-failed\`"
              echo "(infrastructure, not drift)."
              echo
              echo "| run (UTC) | payload date | games | status | malformed | note |"
              echo "| --- | --- | --- | --- | --- | --- |"
            } > outbox/drift-log.md
          fi
          # Unresolved venues ride in the note column rather than as a new
          # column: the log has history, and widening the table would leave
          # every earlier row misaligned to carry a fact that is usually zero.
          VU="${{ steps.sentinel.outputs.unresolved }}"
          if [ -n "$VU" ] && [ "$VU" != "[]" ]; then
            NOTE="${NOTE:+$NOTE; }unresolved venues: $VU"
          fi
          printf '| %s | %s | %s | %s | %s | %s |\n' \
            "$(date -u +'%Y-%m-%d %H:%M')" "${{ steps.sentinel.outputs.date }}" \
            "$GAMES" "$STATUS" "$MALFORMED" "${NOTE:-—}" >> outbox/drift-log.md

          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add outbox/drift-log.md
          git diff --staged --quiet || git commit -m "drift-sentinel: $STATUS on ${{ steps.sentinel.outputs.date }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Fail if the sentinel failed
        if: always() && steps.sentinel.outputs.code != '0'
        run: |
          echo "Sentinel reported a problem — see the log above and outbox/drift-log.md."
          exit 1

      # The Sport union is deliberately evidence-driven: cases are added when a
      # sport is genuinely observed, never invented in advance. That only works
      # if observing one creates work. This turns the alarm into a filed issue
      # naming the exact sports to add, and updates the same issue rather than
      # opening a new one every day.
      - name: File a follow-up for any unmodelled sport
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SPORTS=$(cut -d'|' -f7 /tmp/result.txt)
          UNMODELLED=$(echo "$SPORTS" | tr ' ' '\n' | grep '\*:' | sed 's/\*:.*//' | paste -sd', ' -)
          TITLE="Sport registry: unmodelled sports observed"
          if [ -z "$UNMODELLED" ]; then
            echo "Every observed sport is in the registry: ${SPORTS:-none}"
            # Close the loop rather than leaving a resolved alarm open. An issue
            # that outlives its cause trains people to ignore the next one.
            OPEN=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --comment "Every sport observed on $(date -u +%F) is now in the registry: \`${SPORTS:-none}\`. Reopened automatically if an unmodelled sport appears again."
              echo "Closed issue #$OPEN"
            fi
            exit 0
          fi
          echo "::warning::Unmodelled sports observed: $UNMODELLED"

          BODY=$(printf '%s\n' \
            "The drift sentinel observed sports the \`Sport\` union does not model." \
            "" \
            "**Unmodelled:** $UNMODELLED" \
            "**Full vocabulary this run:** \`$SPORTS\`  (\`*\` marks unmodelled)" \
            "" \
            "Their fixtures currently render under \`UnknownConvention\` — home first" \
            "with a neutral separator, and flagged \`UNMODELLED SPORT\` on the page." \
            "That is deliberate: guessing a home/away convention is what produced the" \
            "original AFL bug (see docs/SPORT-PROOF.md)." \
            "" \
            "To fix: add each case to \`Sport\` in \`src/Desk.fs\`. The compiler will" \
            "then refuse to build until \`sportMeta\` carries an entry for it — that" \
            "refusal is the point, and \`npm run check:proof\` asserts it stays true." \
            "" \
            "_Filed automatically by drift-sentinel. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}_")

          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label "" 2>/dev/null \
              || gh issue create --title "$TITLE" --body "$BODY"
          fi

      # The Odds Story's second follow-up. `closing_odds` is labelled a closing
      # line and, in every sample so far, is a duplicate of the opening snapshot
      # captured seconds EARLIER. Whether that holds across the live slate is a
      # question about the relay, so it is measured rather than assumed — and
      # measured every day, because a fix upstream should close this by itself.
      - name: File a follow-up if closing_odds is never a real closing line
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ODDS=$(cut -d'|' -f8 /tmp/result.txt)
          BOTH=$(echo "$ODDS" | tr ' ' '\n' | grep '^both=' | cut -d= -f2)
          NOTSEQ=$(echo "$ODDS" | tr ' ' '\n' | grep '^notseq=' | cut -d= -f2)
          BOTH=${BOTH:-0}; NOTSEQ=${NOTSEQ:-0}
          TODAY=$(date -u +%F)
          echo "games with both prices: $BOTH, not sequenced: $NOTSEQ"

          TITLE="closing_odds is not a closing line"
          OPEN=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)

          if [ "$BOTH" -eq 0 ]; then
            echo "No game carried both prices today - nothing to conclude."
            exit 0
          fi

          if [ "$NOTSEQ" -eq "$BOTH" ]; then
            BODY=$(printf '%s\n' \
              "On $TODAY, **all $BOTH** games carrying both prices had a \`closing_odds\` that is not a closing line:" \
              "its \`captured_at\` is at or before \`opening_odds.captured_at\`, so the pair is not a sequence and no" \
              "line movement can be inferred from it." \
              "" \
              "Odds shape this run: \`$ODDS\`" \
              "" \
              "The card states this rather than rendering \"line unchanged\" - see \`OddsStory.NotASequence\` in" \
              "\`src/Desk.fs\` and \`docs/ODDS-PROOF.md\`. This is a finding about the relay, not the laboratory:" \
              "the Odds Story layer cannot narrate movement that was never observed twice." \
              "" \
              "Closes itself on the first run where any game shows a real sequence." \
              "" \
              "_Filed by drift-sentinel. Run: $RUN_URL._")
            if [ -n "$OPEN" ]; then
              gh issue comment "$OPEN" --body "$BODY"
              echo "Updated issue #$OPEN"
            else
              gh issue create --title "$TITLE" --body "$BODY"
            fi
          else
            SEQ=$((BOTH - NOTSEQ))
            echo "$SEQ of $BOTH games showed a real open/close sequence."
            if [ -n "$OPEN" ]; then
              gh issue close "$OPEN" --comment "On $TODAY, $SEQ of $BOTH games showed a real open/close sequence (\`$ODDS\`). The blanket claim no longer holds. Reopened automatically if a later run sees none."
              echo "Closed issue #$OPEN"
            fi
          fi
