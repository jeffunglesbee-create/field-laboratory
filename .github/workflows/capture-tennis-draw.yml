name: capture tennis draw

# Dispatch-only, NO schedule. A fixture is captured when a shape needs
# modelling, not on a timer.
#
# The script refuses anything that is not a COMPLETE edition: fewer than seven
# rounds, no champion, or no edges. A partial capture would verify four rounds
# and read as having verified seven, which is the shape of every apparatus
# defect this repo has counted.

on:
  workflow_dispatch:
    inputs:
      tournament:
        description: 'BSD tournament id (77 = Roland Garros WTA)'
        required: false
        default: '77'
      season:
        description: 'Season, YYYY'
        required: false
        default: '2026'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Capture
        env:
          DRAW_TOURNAMENT: ${{ inputs.tournament }}
          DRAW_SEASON: ${{ inputs.season }}
        run: node scripts/capture-tennis-draw.mjs
      - name: Commit the fixture
        run: |
          git config user.email "claude@field.dev"
          git config user.name "FIELD CI"
          git add data/tennis-draw.json data/PROVENANCE.md
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "fixture: capture a complete slam draw [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
