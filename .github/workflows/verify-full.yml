# The two expensive halves of `verify`, split out on 2026-08-17.
#
# WHY
#
# 90% of the month's Actions budget was consumed with roughly fifteen days left,
# and `verify` was about three quarters of the spend — ~782 runner-minutes over
# thirty runs in the first sixteen days of August, and that figure is a floor
# because the API caps each query at thirty runs.
#
# Measured on 9d66cf6, step by step:
#
#   setup, build, decoders, browser checks, all pure-JS checks   1m45s
#   check:proof                                                  2m29s
#   the confidence gate (which runs the mutation suite inside)   17m14s
#
# RE-MEASURED 2026-09-05, and both figures had drifted past double:
#
#   check:proof            5m56s (run 11)   7m06s (run 12)
#   the confidence gate   26m44s (run 11)   >36m52s (run 12, CANCELLED)
#
# The gate figure is a floor, not a measurement: run 12 was killed by the job
# timeout before it printed, so nothing recorded it. Reading the old 17m14s as
# current is what made 45 minutes look generous — see the timeout note below.
#
# Two steps were the entire job. They stay here and run weekly; everything else
# stays in `verify.yml` and runs on every push in about two minutes.
#
# WHAT IS LOST, STATED PLAINLY
#
# The confidence gate no longer runs per commit. That is a real reduction: the
# gate is this repository's central ceremony, and "every row must pass" was
# previously asserted against every push. It is now asserted weekly and on
# demand. A gate failure can therefore land on main and sit there for up to a
# week unless someone dispatches this.
#
# The mitigation is that the gate is a conjunction of commands that all run
# locally — the working practice in this repo is already to run the offline
# suite before pushing, and this workflow is the independent confirmation of
# that rather than the only place it happens.
#
# WHEN TO DISPATCH RATHER THAN WAIT
#
# Before declaring a phase complete, before anything that will be cited as
# evidence, and after any change to `scripts/mutation-check.mjs`,
# `scripts/gate-checks.mjs` or `scripts/confidence.mjs`.
name: verify-full

on:
  schedule:
    # Weekly, not daily. Daily would cost ~20 minutes x 15 days = 300 minutes,
    # which is roughly the entire remaining budget. Weekly costs ~40.
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: verify-full
  cancel-in-progress: true

permissions:
  # write, because the gate's record is committed back — see the last step.
  contents: write
  actions: read

jobs:
  full:
    runs-on: ubuntu-latest
    # The confidence gate runs the whole mutation suite, and the suite grows as
    # invariants are added — measured drift from ~17 min to ~22 as the journalism
    # UI landed, then to 26m44s by 2026-09-05. A runaway (a hung browser
    # mutation, a serve that never answers) would otherwise burn the full
    # six-hour default on a metered runner, so this bounds it.
    #
    # RAISED 45 -> 90 on 2026-09-05, and the reason is work that is new rather
    # than growth. Run 12 was cancelled at 36m52s with NO measurement written,
    # because `confidence.mjs` appends its record only after every row finishes:
    # a timeout here costs the whole run and says nothing about which row was
    # slow.
    #
    # What changed under it, in `e7a7d43`: three mutations that had silently
    # stopped doing anything started doing it again. `cards-run-together` had
    # been failing instantly on an anchor deleted ten days earlier, so it never
    # rebuilt and never drove a browser; `outbox-missing` and `outbox-stub` had
    # a glob narrower than the predicate they test, so on many days they moved
    # no files at all. Repairing them added three real mutation cycles the 45
    # was never sized for. The old cap was "roughly twice the current run"
    # against a 17-minute figure that was already stale twice over.
    #
    # 90 keeps that ratio against the 36m52s floor. It is deliberately a ceiling
    # on a runaway and not a target: if a run approaches it, the suite has grown
    # again and the number needs re-measuring rather than raising by reflex.
    timeout-minutes: 90
    steps:
      # Full history: the gate's history rows walk to the root, and a shallow
      # clone would silently make them pass on one commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Same reason it is first in verify.yml: proof-check injects into real
      # source, and a stranded injection is silent everywhere except the one
      # place that cannot repair it. Costs seconds; runs before the toolchain.
      - name: No source file carries injected proof code
        run: npm run check:clean-source

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: |
          npm ci
          dotnet tool restore

      - name: Build (F# -> JS, then assemble public/)
        run: npm run build

      # The gate drives real browsers through several of its rows, and those
      # rows fetch from the local server. Started here, before anything needs it.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Serve the built site
        run: |
          node scripts/serve.mjs &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done

      # Compiles every violation the proof docs claim is rejected and asserts the
      # compiler really rejects it with the stated error code. A passing proof
      # case is a failing check.
      - name: Proof-doc claims are compiler-verified
        run: npm run check:proof

      # Every row runs a real command and takes its score from the exit code, so
      # the total cannot be asserted, only earned. Below 95 fails the build, and
      # the score is NOT the pass condition — every row must pass.
      #
      # This is also the only place the mutation suite now runs: the gate's
      # `breaking each invariant makes a check fail` row is
      #   --self-test && the full suite && --only known-survivor must FAIL.
      # PEAK SLATE. Added 2026-09-05.
      #
      # Every browser check in this repo loaded a two-card capture, while the
      # live slate that week ran 1 -> 7 -> 15 -> 23 -> 46 -> 126 games
      # (outbox/drift-log.md). 126 is now an ordinary Saturday: CFB alone was 68
      # of them across 8 sports. So grouping, separation, overflow and scroll
      # were all verified two orders of magnitude below the size they describe.
      #
      # Here rather than in `verify` on purpose. These are four browser runs, a
      # peak slate is a weekly event, and verify.yml is the budget line this
      # repository already had to split once — see the header above.
      #
      # The first peak run found no rendering defect and two CHECKS whose
      # premises belonged to the small fixture. Both fixed in tab-check.mjs.
      - name: The page at peak slate size (126 cards, 8 sports)
        run: |
          npm run check:scale
          npm run check:peak
          npm run check:peak-tabs
          npm run check:peak-separation

      - name: Confidence gate (>= 95)
        run: npm run gate

      # THE POINT OF RECORDING A CI RUN IS NOT MORE RECORDS.
      #
      # A CI run can never back a citation written before it existed, so this is
      # not about supplying numbers for outbox entries — local runs do that.
      #
      # It is that a CLEAN run's id is `<sha>-<digest of everything not in HEAD>`,
      # and for a clean checkout that digest is the SHA-256 of the empty string.
      # So CI scoring commit X produces the SAME id as a local run of commit X,
      # and `confidence-record-check.mjs` then has two independent measurements
      # of one tree to compare:
      #
      #   agreeing    -> corroboration, from a different machine with a different
      #                  build directory and no local state
      #   disagreeing -> the gate is not a function of the tree, and something
      #                  outside it moved the score
      #
      # The second is a worse finding than any single failing row, because every
      # other guarantee in this repository assumes the score describes the tree.
      # Nothing could detect it until run ids existed.
      #
      # Runs even when the gate fails: a failing measurement is exactly what a
      # record has to be able to hold, and a log of passes only cannot refuse
      # anything.
      # BEFORE the ledger step, and as its own commit rather than folded into
      # that retry loop. The loop asserts "exactly one new record" per ledger —
      # correct for an append-only jsonl and wrong for a whole-file artifact —
      # so adding this there would have meant rewriting a loop that already
      # survives a real mid-run race.
      #
      # WHY IT EXISTS AT ALL. The gate's mutation row reports `N of M
      # expectation(s) already failing` and the command list is printed into a
      # log 1,300 lines deep in a 50-minute job. On 2026-10-04 two runs reported
      # it and neither log tail reached the list. Three attempts to retrieve it
      # failed, including running the expectations locally — all of them need
      # the Fable build. The measurement existed every time and was never
      # readable.
      - name: Keep the mutation baseline
        if: always()
        run: |
          set -euo pipefail
          test -f outbox/mutation-baseline-latest.json || {
            echo "no baseline artifact this run — the gate did not reach the mutation row"
            exit 0
          }
          git config user.name  'field-laboratory'
          git config user.email 'noreply@github.com'
          git add outbox/mutation-baseline-latest.json
          git diff --staged --quiet && { echo "baseline unchanged"; exit 0; }
          git commit -m "Record the mutation baseline of ${GITHUB_SHA:0:7} [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((attempt * 3))
          done
          echo "could not land the baseline artifact after 3 attempts"
          exit 1

      - name: Record this measurement
        if: always()
        run: |
          set -euo pipefail

          # AN APPEND-ONLY LOG MUST BE RE-APPENDED, NOT REBASED.
          #
          # This step used to commit the record and then `git pull --rebase`.
          # Both sides of that rebase append a line to the end of the same file,
          # so git sees two different last lines and calls it a content
          # conflict — every time, by construction.
          #
          # It fired on 2026-09-05, run 13: the gate scored 530/530 and the step
          # died with "CONFLICT (content): Merge conflict in
          # docs/confidence-log.jsonl". The measurement was real, it was printed,
          # and it never reached the repository — half an hour of runner time
          # producing no durable record because of the order of two git commands.
          #
          # The fix is to treat the file as what it is. Capture the ONE line each
          # ledger just gained, get a clean checkout of whatever is now on the
          # branch, append those lines, and push. There is no merge to resolve
          # because there is no divergent history — a record is data, and it
          # commutes with every other append. Run 15 proved it on a real race:
          # main moved to 499a43a mid-run and the record still landed on
          # attempt 1.
          #
          # TWO LEDGERS as of 2026-09-05. `scale-check.mjs` writes the peak-slate
          # mount time to docs/scale-log.jsonl, and its figure was previously
          # unrecoverable: a step's stdout is byte-capped out of the log tail once
          # a 39-minute gate runs after it, so the one CI measurement that
          # mattered passed its assertion and then could not be read back.
          #
          # Both are landed by ONE commit rather than two, because they describe
          # the same run of the same tree and splitting them would let a reader
          # find one without the other.
          LEDGERS="docs/confidence-log.jsonl docs/scale-log.jsonl"

          PENDING=""
          for LEDGER in $LEDGERS; do
            git diff --quiet -- "$LEDGER" && continue
            LINE=$(git diff -- "$LEDGER" | grep '^+' | grep -v '^+++' | sed 's/^+//')
            if [ "$(printf '%s\n' "$LINE" | grep -c .)" -ne 1 ]; then
              echo "expected exactly one new record in $LEDGER, got:"
              printf '%s\n' "$LINE"
              exit 1
            fi
            ID=$(printf '%s' "$LINE" | node -e \
              'process.stdin.on("data",d=>console.log(JSON.parse(d.toString()).id))')
            echo "record to land in $LEDGER: $ID"
            PENDING="$PENDING$LEDGER\t$ID\t$LINE\n"
          done

          if [ -z "$PENDING" ]; then
            echo "no ledger gained a record — nothing to commit"
            exit 0
          fi

          git config user.name  'field-laboratory'
          git config user.email 'noreply@github.com'

          for attempt in 1 2 3; do
            for LEDGER in $LEDGERS; do git checkout -- "$LEDGER" 2>/dev/null || true; done
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

            WROTE=0
            while IFS=$'\t' read -r LEDGER ID LINE; do
              [ -n "$LEDGER" ] || continue
              # Idempotent by run id: a retry that finds the id already present
              # leaves it alone rather than writing a second copy.
              if grep -qF "\"$ID\"" "$LEDGER" 2>/dev/null; then
                echo "attempt $attempt: $ID already in $LEDGER"
                continue
              fi
              printf '%s\n' "$LINE" >> "$LEDGER"
              git add "$LEDGER"
              WROTE=1
            done <<< "$(printf '%b' "$PENDING")"

            if [ "$WROTE" -eq 0 ]; then
              echo "attempt $attempt: every record was already landed — nothing to do"
              exit 0
            fi

            git commit -m "Record CI measurement of ${GITHUB_SHA:0:7} [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "attempt $attempt: landed"
              exit 0
            fi
            echo "attempt $attempt: push rejected, someone else moved the branch — re-appending"
            git reset --hard HEAD~1
          done

          echo "could not land the record(s) after 3 attempts"
          exit 1
