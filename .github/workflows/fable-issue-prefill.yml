# Is the Fable compiler crash already reported, and what is the one-click link that files it?
# scripts/fable-issue-prefill.mjs; the report is outbox/fable-crash-upstream-issue.md (docs/CC-CMD-2026-11-03-fable-compiler-crash.md).
#
# Reads the PUBLIC search API of the Fable repository, writes outbox/fable-issue-prefill-latest.md (the verdict, any candidate duplicates, and GitHub's
# own new-issue link with the title and body filled in) and commits it. It posts nothing: filing is the owner's click, because posting would need a token
# for a repository this project does not own. In the search step the job's GITHUB_TOKEN only raises the search rate limit; the Commit step pushes to THIS
# repository with the token the checkout stored.
#
# Trigger: a push of outbox/.trigger-fable-issue-prefill (runs from the pushing ref's own copy of this file) or a dispatch. No schedule: it answers one question.
name: fable-issue-prefill

on:
  workflow_dispatch:
  push:
    paths:
      - 'outbox/.trigger-fable-issue-prefill'

concurrency:
  group: fable-issue-prefill
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prefill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Search, then write the link
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `a | tee` takes tee's exit status under the default shell (bash -e, no pipefail), so a search that threw would leave this step GREEN and the previous
        # verdict standing in the file: exactly what the script exists to prevent (found by review; forecast-run.yml records the same trap measured on a run).
        run: |
          node scripts/fable-issue-prefill.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          exit ${PIPESTATUS[0]}
      - name: Commit
        run: |
          git config user.email "noreply@anthropic.com"
          git config user.name "Claude"
          git add outbox/fable-issue-prefill-latest.md
          git diff --staged --quiet && exit 0
          git commit -m "probe: is the Fable crash already reported, and the link that files it [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then break; fi
            sleep $((i * 5))
          done
          git fetch -q origin "${GITHUB_REF_NAME}"
          git merge-base --is-ancestor HEAD "origin/${GITHUB_REF_NAME}" \
            || { echo "FAIL: push did not land after retries"; exit 1; }
