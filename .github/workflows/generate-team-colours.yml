# Generates src/TeamColours.fs from ESPN, and commits it only if it BUILDS.
#
# ATOMIC BY CONSTRUCTION. The generated module returns `Palette.Token`, so it
# must be registered in the fsproj — and a commit that adds the registration
# without the file, or the file without the registration, leaves `main` unable
# to compile. Both happen here, in one commit, after a real build has proved the
# pair works. The workflow cannot push a tree it has not compiled.
#
# THE STUB DATA THAT PROVED THIS LOCALLY IS NOT COMMITTED. It was invented team
# names, and inventing data is what this project refuses; the real table only
# ever comes from here.
#
# WHY CI: site.api.espn.com and *.workers.dev are both blocked by the dev
# sandbox's egress allowlist. DISPATCH ONLY — a colour table that regenerates on
# a schedule would rewrite the page's palette without anyone reading the diff.
name: generate team colours

on:
  workflow_dispatch:
    inputs:
      date:
        description: Slate whose spellings to include (YYYY-MM-DD, default yesterday ET)
        default: ''

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install
        run: |
          npm ci
          dotnet tool restore

      - name: Generate the table
        run: |
          node scripts/generate-team-colours.mjs --self-test
          node scripts/generate-team-colours.mjs ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      # Idempotent: a generator owns the registration of its own output, and
      # re-running must not add a second line.
      - name: Register it in the fsproj if it is not already there
        run: |
          if ! grep -q 'Include="TeamColours.fs"' src/Laboratory.fsproj; then
            python3 - <<'PY'
          p = 'src/Laboratory.fsproj'
          s = open(p).read()
          old = '    <Compile Include="Route.fs" />'
          new = ('    <!-- GENERATED by scripts/generate-team-colours.mjs. Below Palette.fs,\n'
                 '         which it returns Tokens from; above every view that reads a club\n'
                 '         colour. Added by .github/workflows/generate-team-colours.yml. -->\n'
                 '    <Compile Include="TeamColours.fs" />\n') + old
          assert old in s, 'anchor missing — the fsproj moved'
          open(p, 'w').write(s.replace(old, new, 1))
          PY
          fi

      # The gate. A table that does not compile, or that breaks a suite case,
      # must not reach main — and this is the only place that can know.
      - name: Build and prove the suite still holds
        run: |
          npm run build
          npm run check:verify

      - name: Commit
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add src/TeamColours.fs src/Laboratory.fsproj
          git diff --staged --quiet || git commit -m "generated: team colours table [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
