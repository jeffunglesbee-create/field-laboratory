# THROWAWAY, on branch tls-premise, never merged. main's copy of this file is the generic URL probe; this branch's copy runs one premise probe for
# docs/CC-CMD-2026-11-14-weather-failure-tls-stage.md (Rule 100): what a public resolver and the host's own nameservers answer from a runner, and what
# a TLS handshake and a pinned request to each address do (fourth version: a packet capture beside curl and openssl). A dispatch from this branch uses this copy; main's copy is untouched.
name: probe-url

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'unused on this branch'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Premise
        run: |
          cat > "$RUNNER_TEMP/v4.mjs" <<'V4_EOF'
          // What a TCP-only connect and one default-hello TLS handshake do to one address, from this runner. Run before and between curl, openssl and a packet capture.
          import net from 'node:net';
          import tls from 'node:tls';
          const address = process.argv[2];
          const ms = (t0) => Date.now() - t0;
          const tcpOnce = (cap) => new Promise((resolve) => {
            const t0 = Date.now();
            const s = net.connect({ host: address, port: 443 });
            const done = (v) => { s.destroy(); resolve(v); };
            const t = setTimeout(() => done(`no-connect-in-${cap}ms`), cap);
            s.once('connect', () => { clearTimeout(t); done(`connected ${ms(t0)} ms`); });
            s.once('error', (e) => { clearTimeout(t); done(e.code ?? 'error'); });
          });
          const tlsOnce = (cap) => new Promise((resolve) => {
            const t0 = Date.now();
            let tcp = null;
            const s = tls.connect({ host: address, port: 443, servername: 'api.open-meteo.com', ALPNProtocols: ['http/1.1'] });
            const done = (v) => { s.destroy(); resolve(v); };
            const t = setTimeout(() => done(tcp === null ? `tcp no-connect-in-${cap}ms` : `tcp ok ${tcp} ms, tls no-answer-in-${cap}ms`), cap);
            s.once('connect', () => { tcp = ms(t0); });
            s.once('secureConnect', () => { clearTimeout(t); done(`tcp ok ${tcp} ms, tls ok ${ms(t0) - tcp} ms ${s.getProtocol()}`); });
            s.once('error', (e) => { clearTimeout(t); done(tcp === null ? `tcp ${e.code}` : `tcp ok ${tcp} ms, tls ${e.code ?? e.message}`); });
          });
          const before = []; for (let i = 0; i < 3; i++) before.push(await tcpOnce(3000));
          console.log(`tcp-only, three connects before anything else: ${before.join(' | ')}`);
          console.log(`node tls, default hello, 4 s cap: ${await tlsOnce(4000)}`);
          process.exit(0);
          V4_EOF
          set +e
          URL='https://api.open-meteo.com/v1/forecast?latitude=42.3467&longitude=-71.0972&current=temperature_2m,apparent_temperature,precipitation,rain,wind_speed_10m,wind_direction_10m,wind_gusts_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto'
          echo "tcpdump: $(command -v tcpdump || echo absent); curl: $(curl --version | head -1 | cut -c1-60); openssl: $(openssl version)"
          for ADDR in 51.81.167.44 167.114.211.86; do
            echo "=================== $ADDR"
            CAP="$RUNNER_TEMP/cap-$ADDR.txt"
            : > "$CAP"
            if command -v tcpdump >/dev/null 2>&1; then
              sudo timeout --signal=INT 45 tcpdump -nn -tt -v -l -i any "tcp port 443 and host $ADDR" > "$CAP" 2>&1 &
              sleep 2
            fi
            node "$RUNNER_TEMP/v4.mjs" "$ADDR"
            echo "--- curl -v, default hello, 10 s cap"
            curl -v -sS -m 10 --resolve "api.open-meteo.com:443:$ADDR" -o /dev/null -w 'HTTP %{http_code} connect=%{time_connect}s tls=%{time_appconnect}s total=%{time_total}s\n' "$URL" 2>&1 | grep -E '^\* (Trying|Connected|Connection|TLSv|ALPN|SSL|Operation)|^\} \[|^HTTP|^curl:' | cut -c1-170 | head -24
            echo "--- openssl s_client, 10 s cap"
            timeout 12 openssl s_client -connect "$ADDR:443" -servername api.open-meteo.com -brief < /dev/null 2>&1 | cut -c1-170 | head -14
            echo "--- tcp-only, three connects after the others"
            node -e 'const net=require("net");const a=process.argv[1];(async()=>{const r=[];for(let i=0;i<3;i++)r.push(await new Promise(res=>{const t0=Date.now();const s=net.connect({host:a,port:443});const d=v=>{s.destroy();res(v)};const t=setTimeout(()=>d("no-connect-in-3000ms"),3000);s.once("connect",()=>{clearTimeout(t);d("connected "+(Date.now()-t0)+" ms")});s.once("error",e=>{clearTimeout(t);d(e.code)})}));console.log(r.join(" | "));process.exit(0)})()' "$ADDR"
            sleep 2
            sudo pkill -INT tcpdump
            sleep 1
            echo "--- tcpdump of $ADDR: $(wc -l < "$CAP") lines, the first 90"
            head -90 "$CAP" | cut -c1-190
          done
