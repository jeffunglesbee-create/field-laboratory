# Runs every guard in this repo on every push.
#
# These checks all existed and none of them ran automatically — they were
# executed by hand in the session that wrote them and then never again. That is
# worth naming, because the guard this workflow most exists to run is the
# stale-node regression check, and the bug it guards against originally survived
# a passing check suite. A regression guard nobody executes is documentation.
name: verify

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'outbox/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

# Read-only, and narrower than the default. `actions: read` is here for one
# step: the live GitHub-API read, which asks this workflow's own history whether
# main passed. Nothing in this job writes anything back.
permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Full history, not the default shallow clone. The history check walks to
      # the root; with fetch-depth 1 it would see one commit. FIELD's production
      # gate hit exactly this and papered it with `fetch-depth: 25`, which is
      # only ever "deep enough until it isn't".
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # FIRST, before the toolchain is even installed. `proof-check` proves its
      # claims by injecting code into a real source file; on 2026-08-15 a
      # foreground timeout killed it mid-run and `let private __proof23` was
      # committed to src/Scoreboard.fs in 217282b.
      #
      # That injection COMPILED. It passed the build, passed "fail on any F#
      # compiler warning", and passed fifteen further steps — the only thing
      # that noticed was proof-check's own marker guard at step 17, ninety
      # seconds in, and by then it could only refuse: its backup lives in
      # tmpdir(), so on a fresh runner repair is impossible by construction.
      #
      # A stranded injection was silent everywhere except the one place that
      # could not fix it. This is the cheap half — no build, no browser, no
      # network — so a mutated tree costs seconds instead of a job.
      - name: No source file carries injected proof code
        run: npm run check:clean-source

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: |
          npm ci
          dotnet tool restore

      - name: Build (F# -> JS, then assemble public/)
        run: npm run build

      - name: Fail on any F# compiler warning
        run: |
          # The build above is the real one; this recompiles to inspect output.
          # Warnings here have twice been the first sign of something actually
          # wrong (a duplicate FSharp.Core reference, a redundant downcast
          # hiding a type confusion), so they are not tolerated.
          dotnet build src/Laboratory.fsproj --no-restore 2>&1 | tee /tmp/build.txt
          if grep -qE 'warning (FS|NU)[0-9]+' /tmp/build.txt; then
            echo "::error::Build emitted warnings — see above."
            exit 1
          fi

      - name: Decoders accept the real captures
        run: |
          node scripts/drift-check.mjs --file data/context-2026-05-15.json
          node scripts/drift-check.mjs --file data/games-2026-08-09.json

      - name: Decoders still REJECT the corrupted fixture
        run: |
          # Asserting the failure path still fails. Without this, a decoder
          # loosened until everything passes would look identical to a correct
          # one on every other check in this file.
          if node scripts/drift-check.mjs --file test/malformed-nested.json; then
            echo "::error::The corrupted fixture decoded cleanly. The decoders have lost their teeth."
            exit 1
          fi
          echo "Corrupted fixture correctly rejected."

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render checks (both captures, including the state transition)
        run: |
          node scripts/serve.mjs &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          npm run check
          npm run check:hard
          # Added 2026-08-29. The two captures above are SINGLE-SPORT — AFL and
          # MLB — as the comment below already says. So every Sport case added
          # since AFL (CFB, Bundesliga, EPL, La Liga, Ligue 1, Serie A, the six
          # UEFA competitions, NFL, CFL, PGA Tour) was verified by check:proof,
          # which asserts a case without a registry entry does not COMPILE, and
          # by nothing that renders one.
          #
          # data/context-2026-08-29.json is a real captured payload — 78 rows,
          # 11 sports — so this asserts on the same run that no section reads
          # UNMODELLED SPORT and that each convention produces its own separator
          # ("@" for AwayAtHome, "v" for HomeVersusAway). That distinction is
          # not cosmetic: a stale build rendered Bundesliga as "vs"
          # (UnknownConvention) while the label itself looked correct, and any
          # check asserting only that the label appears would have passed on it.
          npm run check:render-sports

      # Grouping and date navigation, which the two checks above structurally
      # cannot reach: both captures are single-sport, and both pin `?data=`,
      # which disables the date controls by design. This probe intercepts the
      # relay at the network layer instead, so it needs no egress and asserts
      # that each navigation leaves exactly the new slate behind.
      - name: No canonical viewport overflows horizontally
        run: |
          # "FIELD — Viewport Consistency Specification" (Drive, May 24 2026,
          # DEFINITIVE) lists this under P1: "Assert: no element overflows
          # viewport horizontally". On 2026-08-29 the desk failed it on every
          # portrait phone -- 216px at 360, 185px at 393, 150px at 430 -- and
          # nothing in CI looked. Every render check passed throughout, because
          # they assert on CONTENT, and content renders fine inside a page that
          # is too wide. The failure is geometric, so the assertion is geometric.
          #
          # Ten states, measured twice each: at rest, and with every flippable
          # card open. The second pass is not padding -- a grid-column: span 2
          # added the same day was sound at rest and manufactured a second grid
          # track on a phone once a card opened.
          node scripts/serve.mjs &
          for i in $(seq 1 30); do curl -sf http://localhost:8080/ -o /dev/null && break; sleep 1; done
          npm run check:viewport-overflow

      - name: Grouping and date-navigation checks
        run: npm run check:nav

      # The drama sparkline: fixed 0-100 domain, bucketed-max downsampling, and
      # the ADR-002 gate that keeps it off live games. The downsampling property
      # is exercised over hundreds of real series, because the single committed
      # arc cannot tell bucketed max from every-Nth.
      - name: Drama sparkline
        run: npm run check:spark

      # The semantic color system, over the real compiled Palette.fs: tokenOf is
      # total and injective, the drama/advancement scales partition 0-100 at the
      # spec boundaries, QUIET has no accent, and every token clears a contrast
      # ratio on the background. The compiler claims (sealed hex, exhaustive
      # registry, un-crossable scales) are in docs/PALETTE-PROOF.md and run under
      # check:proof in verify-full. Self-test first: the contrast math must be
      # shown to discriminate.
      - name: The semantic palette holds
        run: npm run check:palette

      # Three device affordances the page carries, and one it must NOT fake.
      # Filed 2026-09-01 after measuring this page's device handling against
      # jubilant-bassoon's. Four gaps were counted and TWO WERE NOT GAPS:
      # `viewport-fit` appears zero times in either file, so the client's nine
      # env(safe-area-inset-*) declarations all resolve to 0, and this page uses
      # no viewport-height unit for dvh to improve on. So the check guards the
      # negative too — env() and viewport-fit=cover are asserted paired-or-absent,
      # because env() alone is inert and cover alone puts content under the notch
      # with nothing holding it out. Both directions fail; neither and both pass.
      - name: Device affordances, including the one not to fake
        run: npm run check:device-chrome

      # A failure must not be able to look like progress. `report` wrote
      # textContent only, so FETCH FAILED rendered exactly like "decoding…",
      # and `.meta`'s container `opacity` composited the subtree so no child
      # could paint back to full strength — the container was the reason an
      # error could not be made to look like one. Reads build/Program.js, the
      # artifact the browser runs, not the F# it came from: Fable inlines and
      # renames, and routing that reads correctly in source is not thereby
      # present in the output. Runs after the build step above for that reason.
      - name: A failure looks like a failure
        run: npm run check:status-state

      # The win-probability market-shape model, over the real compiled Market.fs:
      # constructors validate the sum, the two-way complement is correct where
      # allowed, and on a real de-vigged three-way market the two-way complement
      # folds the draw into away — the jubilant-bassoon defect, in arithmetic. The
      # compiler claims (two-way complement / accessor can't touch a three-way
      # market; a bare number can't become one) are in docs/WP-PROOF.md under
      # check:proof.
      - name: The market-shape model holds
        run: npm run check:wp

      # The typography system, over the real compiled Typography.fs: two faces
      # only and both used, one style per role, Chakra Petch as the identity face,
      # Data carries tabular numerals, every font stack ends in a real fallback.
      # The compiler claims (sealed style, exhaustive role registry, two-fonts-
      # only) are in docs/TYPOGRAPHY-PROOF.md under check:proof in verify-full.
      - name: The typography system holds
        run: npm run check:typography

      # The deployed page's colours and fonts ARE the typed modules: build-site
      # injects a #design-tokens block generated from Palette.fs / Typography.fs,
      # and this asserts every value in it equals the module it came from, plus
      # that the self-hosted fonts ship and no font CDN is hotlinked. Runs after
      # the build, which is where the injection happens.
      - name: The page's design tokens match the modules
        run: npm run check:design-tokens

      # A pictograph used as a visual asset, caught in SOURCE before the build.
      # PickView.fs prefixed the tie note with a scales glyph, restating what the
      # note already said in whatever font the OS substituted. Arrows are
      # deliberately allowed: the date-nav buttons' glyphs ARE their content.
      #
      # This used to check two more things — a coloured rail on a rounded box,
      # and a state modifier declaring a change it does not make. Both needed to
      # know how the cascade resolves, which no source-level check can, and it
      # got `.pk-side--none` wrong on its first live run. They moved to
      # check:computed-chrome below.
      - name: No pictograph is a visual asset
        run: npm run check:glyph

      # Both picks. The decoder check runs headless; the tab check drives a real
      # browser and asserts, among other things, that the composite pick score
      # appears nowhere in the rendered DOM.
      - name: Pick decoders
        run: npm run check:pick

      # The chrome, MEASURED on the rendered page. Three claims a stylesheet
      # can make and fail to keep, none of which source text can settle:
      #
      #   a state that declares a change and does not make it — `.pk-sport--on`
      #   set a background and a border-colour identical to `.pk-sport`'s own;
      #   a one-sided border on a rounded box, on an element that really renders;
      #   a class the stylesheet defines that nothing anywhere emits — five of
      #   those, including two dangling references a rules-only scan had missed.
      #
      # It also carries the assertion that would have caught its OWN first run:
      # that the stylesheet parsed into classes at all. `if (r.cssRules)` is
      # truthy for the empty list modern Chromium gives every style rule, so the
      # first version read zero classes and passed everything vacuously.
      - name: The chrome, measured on the rendered page
        run: npm run check:computed-chrome

      - name: Tabs, both pick panels, and the ADR-002 display check
        run: npm run check:tabs

      # Team tints, on the page rather than in the type system. Three of the four
      # defects this found were invisible to the F# suite BY CONSTRUCTION: the
      # suite measures contrast against `bg`, and team names sit on a card, so it
      # agreed with a tint scoring 4.35 on the surface it actually rendered on.
      #
      # It also asserts the constraint that is a design decision rather than a
      # measurement — tints appear ONLY on matchup names, never in the pick
      # panel, the pick'em rows or the stats headers. Colours are for matchups,
      # not standings, and that is enforced here rather than remembered.
      #
      # Uses the capture with a real multi-sport slate, not the two-row one:
      # a check that renders no tinted card passes every assertion below it, so
      # "at least one matchup is tinted" is itself one of the assertions.
      - name: Team tints, on the rendered page
        run: npm run check:team-tints

      # The screenshot is the artifact a red run needs and a green run does not.
      - name: Keep the screenshot when the tints check fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: team-tints-screenshot
          path: outbox/team-tints-*.png
          if-no-files-found: ignore

      # Stage 1 of surfacing the journalism work: a game card with a joined
      # brief turns to reveal the prose. Driven in a real browser against a
      # fixture built from REAL captured briefs, because both committed render
      # fixtures carry `briefs: []` and could never exercise it. Asserts the
      # disclosure semantics (role=button, aria-expanded, keyboard), that only
      # cards with a brief are flippable, and that the flip wrapper does not hide
      # the score/teams nodes the weather fill and score setters query.
      - name: A card with a brief flips to reveal it
        run: |
          node scripts/serve.mjs &
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          npm run check:brief-flip

      # Pick'em against a synthetic multi-sport slate served at the network
      # layer: both committed captures are single-sport and two games long, so
      # neither can reach the sport chips, a graded pick, a draw, or the row
      # layout. Includes the "Rockies @ Diamondbacks" row whose status chip
      # wraps onto a second line on the production screen.
      - name: Pick'em — chips, grading, and the row that wraps in production
        run: npm run check:pickem

      # ADR-002's composite-score scan, and the outlet exclusion that keeps it
      # from firing on broadcast data. live-check went red on 2026-08-15 because
      # the slate carried "KFMB 8.1 (CBS)" — a real ATSC channel number — and a
      # scan meant for leaked pick scores matched it.
      #
      # This needs its own fixture: games-2026-08-09.json renders ZERO
      # .pick-outlets elements, so on the committed capture the exclusion is
      # never exercised and live-tabs-check's outlet assertions pass vacuously
      # (verified: 0 elements). A synthetic slate carrying the outlet proves the
      # chain on a real DOM — including that the OLD scan really did flag it, so
      # the bug is reproduced rather than assumed.
      - name: The composite-score scan skips outlets and nothing else
        run: npm run check:outlet-scan

      # `check:proof` and the confidence gate MOVED to verify-full.yml on
      # 2026-08-17. Measured on 9d66cf6: proof 2m29s and the gate 17m14s, of a
      # 36-minute job whose every other step totalled about 1m45s. Those two
      # were the job. Everything cheap stays here and runs on every push;
      # the two expensive ones run weekly and on demand.

      # Phase 2. The set difference that is actually non-empty: every row in the
      # corpus carries a quality_score and NOT ONE carries a scoring_version, so
      # {stored} minus {attributed} is all 592. Same shape as AnsweringModel — a
      # stored value whose provenance the store does not record.
      - name: A score cannot say which rubric produced it
        run: npm run check:corpus

      # `briefs.game_id` holds seven key spaces in one column with nothing
      # recording which. The first successful capture joined on `games.id`
      # alone and reported 6.2%; resolving each scheme to the key space it is
      # actually in gives 69.4% over the same data.
      #
      # Pinned per scheme rather than as one rate, because the aggregate is what
      # hid the bug — "6.2%" reads as a weak signal, while "92.4% of one scheme
      # and 0% of three others" names it. Self-test first: it carries game rows
      # whose ids collide with the schemes that must resolve to nothing, so the
      # refusals are load-bearing instead of true by absence.
      - name: One column, seven key spaces — the brief-to-game join
        run: npm run check:game-id

      # Phase 5. `proof-check` keeps COMPILER claims honest; this keeps the
      # PRODUCTION numbers honest — the corpus minimums, the percentages, the
      # scales that documents quote and nothing re-derives. Every claim is a
      # `<!-- claim: id = value -->` marker whose id names a registry entry
      # computed from committed data.
      #
      # Deliberately a plain verify step rather than a gate row: gate rows moved
      # to verify-full and run weekly, and a stale document caught seven days
      # late is most of the way to not catching it. This costs under a second.
      #
      # Self-test first, in the same command: a docs checker that cannot detect a
      # stale claim would report every document true forever.
      # The first check here that tests a claim in GENERATED PROSE against the
      # data it was generated from. Narrow on purpose: scorelines only.
      #
      # The plan's acceptance criterion for this was wrong and the data said so
      # — briefs are written mid-game, rows carry finals, and requiring a match
      # would flag almost every brief. The relation that holds is dominance per
      # side, because scores do not decrease. src/Scoreline.fs makes a mid-game
      # score and a final different types so the mistake cannot be rewritten.
      #
      # Self-test first: the extractor discards 554 candidates down to 147, and a
      # filter that aggressive has to be shown to still catch a fabrication.
      - name: No brief claims a scoreline its game could not have reached
        run: npm run check:scoreline

      - name: Every claim a document makes is still true
        run: npm run check:docs

      # Cheap and early: does every workflow job actually satisfy the imports of
      # the scripts it invokes? Added after two live-check runs failed on a step
      # that imported build/ from a job with no build.
      - name: Workflow jobs can run what they invoke
        run: npm run check:workflows

      # The BACKWARD half of the question above. `check:workflows` asks whether
      # every `npm run X` resolves; this asks whether every script a workflow
      # depended on is still reached. It runs in guards.yml too, and the split
      # is not redundancy — it is the two trigger sets. This workflow's
      # paths-ignore excludes docs/, so a commit that edits ONLY
      # docs/unreachable-scripts.txt never reaches here; guards.yml fires on
      # exactly that. guards.yml's paths are docs/, outbox/ and **/*.md, so a
      # commit that edits ONLY package.json or scripts/ never reaches THERE --
      # which is precisely the shape of the clobber this check was written for.
      # Either workflow alone leaves one of the check's two inputs unguarded.
      - name: No script a workflow depends on became unreachable
        run: node scripts/check-script-orphans.mjs --self-test && node scripts/check-script-orphans.mjs

      # The deploy-landed classifier — is the published artifact the newest
      # DEPLOYABLE commit, not merely main HEAD (docs/[skip ci] commits correctly
      # do not deploy). Only the self-test runs here; the live assertion runs in
      # live-check, post-deploy, where the site can be reached.
      - name: The deploy-landed classifier discriminates
        run: node scripts/deploy-landed-check.mjs --self-test

      # The gate's row inventory guard, self-tested. Its own assertions run here
      # rather than only inside the gate, so a broken guard is a named failure
      # instead of a gate that quietly stops comparing.
      - name: Gate inventory guard has teeth
        run: npm run check:gate-rows

      # State transitions at named instants. `gameState` used to read the wall
      # clock twice, so every assertion about it was an assertion about when CI
      # happened to run. Includes four wrong implementations, run against the
      # same table, so a passing row means something.
      - name: Game state at fixed instants
        run: npm run check:state

      # A row the desk cannot name both sides of must cost exactly that row.
      # `Decode.list` is all-or-nothing, so on 2026-08-13 one PGA Tour row with
      # NULL sides took the whole deployed slate down and live-check reported
      # "decoded NaN, rendered 0" against a blank page. The assertion is the
      # conservation law — rows in === games out + rows counted unnamed — because
      # the failure mode of the fix is a silent skip that looks healthy. Proven
      # to have teeth: 3/9 against the pre-fix decoder, 9/9 after.
      - name: Rows the desk cannot name
        run: npm run check:unnamed

      # The sport registry against the sports production actually serves.
      # drift-sentinel reported `unmodelled: NFL, CFL, golf` two days running,
      # and an unmodelled sport is not cosmetic: it gets UnknownConvention, so
      # the desk named the visiting side second on every NFL card.
      #
      # Exercises both halves — matchupText AND orderByMatchup — because those
      # are the two that once disagreed and printed a scoreline transposed
      # against the names. Also pins golf as deliberately unmodelled, so a check
      # reading "everything is modelled" cannot push someone to model a
      # tournament as a two-sided contest to get green.
      - name: The sport registry matches what production serves
        run: npm run check:sports

      # Line numbers rot. Six citations were published into CC-CMDs on the
      # morning of 2026-08-25 and five were wrong by the afternoon, because the
      # same session then edited the file it had cited. A stale citation is
      # worse than none: it points confidently at unrelated code and is trusted
      # because it is specific.
      #
      # FATAL when an anchored citation's quoted fragment is not in the file --
      # a specific checkable claim that is false. A RATCHET on bare
      # `path:line` citations, which cannot be verified and may not grow.
      # Missing files are reported and never fatal: this repo cites relay paths
      # constantly, 98 of them.
      - name: Doc citations are anchored, not just numbered
        run: npm run check:citations

      # `.github/workflows/update-odds-key.yml`, deleted 2026-08-25, was named
      # "Set ODDS_API_KEY to 20K plan key" and piped the EXHAUSTED free-tier key
      # into `wrangler secret put`. One dispatch would have replaced the working
      # production key with a dead one and printed a green checkmark.
      #
      # The tempting rule -- a step's name must match what it does -- was
      # measured before being written: over 828 steps in three repos it produced
      # 73 hits, essentially all section labels and subject nouns. That
      # signal-to-noise gets a check deleted, so this checks the MECHANISM
      # instead. A command installing a secret must take its value from a
      # variable or a secrets.* expression, never a quoted literal. No judgement
      # in it: a literal cannot be rotated, cannot be audited, and is in git
      # history the moment it is written.
      - name: No workflow installs a credential from a literal
        run: node scripts/check-no-literal-secret-writes.mjs --self-test && node scripts/check-no-literal-secret-writes.mjs

      # src/Prose.fs against the relay's real tokeniser, over all 592 briefs in
      # data/jq-mlb-game-corpus.json. Agreement is the test: a port that quietly
      # computed something more sensible than the thing it claims to reproduce
      # would pass every check it wrote for itself and prove nothing about
      # production. Needs the build, and needs the corpus to be non-empty —
      # both asserted inside the script.
      - name: JQ prose dimensions agree with production
        run: npm run check:prose

      # The flat 240 quality bar against the scale the relay can actually reach.
      # journalism-quality.js documents its own ceiling as 245 — the worker has
      # no game object, so Dim 7 (25) and Dim 10 (30) are structurally zero. So
      # 240 is 80% of the rubric and 97.96% of what any brief can score, and on
      # 2026-08-15 `above_240` was 0 on all 25 brief_type/sport rows.
      #
      # Offline: the corpus assertions run against the 592 committed briefs, and
      # the /quality/report figures are a dated observation rather than a fetch,
      # because a check that skips when the relay is unreachable is not a check.
      - name: The quality bar is on the scale the scorer can reach
        run: npm run check:ceiling

      # Phase 3's two acceptance tests. The first reaches the Haiku fallback
      # branch, which production has NEVER exercised — six of six sampled proxy
      # calls answered from Gemini with X-FIELD-Gemini-Error empty — and proves
      # the selection logic names the model we declared, surfaces the fallback
      # rather than the primary, and reports UNKNOWN rather than false when both
      # paths fail. The second runs the time-anchoring extractor over all 592
      # briefs against a verbatim copy of the relay's _temporalPrecision, so
      # agreement means it reproduces production rather than something tidier.
      - name: J-layer provenance, time anchoring, and the unexercised fallback
        run: npm run check:journalism

      # The census that produced that corpus, executed rather than assumed.
      # `jq-density-census.mjs` only ever ran on a dispatched runner — the relay
      # is 403 CONNECT at the agent proxy — so when its tokenizer was extracted
      # into `jq-tokenizer.mjs`, the refactor shipped with `node --check` as its
      # only evidence, which is syntax and not execution. `--from-disk` reads the
      # committed corpus instead of the relay, so the import, the shared fixture
      # names, and the fixture block all run here on every push. It cannot cover
      # `fetchDate`; the dispatched workflow is still the only thing that does.
      - name: The census script runs, against the corpus it captured
        run: npm run check:census

      # The weather fan-out, measured as runtime concurrency rather than read
      # off a constant. It was unbounded — one request per venue, all at once —
      # and on 2026-08-15 a twelve-venue slate earned a 429 from Open-Meteo that
      # took three live-check assertions red from one cause. Drives the real
      # compiled F# with a stubbed `fetch` that resolves on a later macrotask,
      # so requests genuinely overlap and the peak is meaningful; a stub that
      # resolved synchronously would report a peak of 1 for the broken code too.
      - name: The weather fan-out stays inside its burst bound
        run: npm run check:weather-burst

      # Deterministic zone assertions. CI runs whenever a push lands, which is
      # almost never inside the 00:00-04:00 UTC window where ET and UTC differ,
      # so the zone logic would otherwise be exercised only by luck.
      - name: FIELD-zone day checks
        run: npm run check:zone

      # zone-check proves the day arithmetic; this proves the day arithmetic
      # CHANGES WHAT THE PAGE FETCHES. It names an instant inside the 00:00-04:00
      # UTC window, asks the real compiled F# which day that is, and pulls BOTH
      # that day and the UTC day from the live relay — so the difference the fix
      # makes is two HTTP responses rather than an argument, available at any
      # hour instead of once a night.
      #
      # It lives here, not in live-check, for two reasons that both matter: it
      # imports from build/ (live-check never builds) and it needs relay egress
      # (the dev sandbox has none).
      - name: The zone choice changes the slate (window simulation)
        run: npm run check:window

      # The mutation suite USED to run here as its own step. It was deleted on
      # 2026-08-16: it is the identical command to the second conjunct of the
      # confidence gate's `breaking each invariant makes a check fail` row —
      #
      #   ok('node scripts/mutation-check.mjs --self-test') &&
      #   ok('node scripts/mutation-check.mjs') &&          <- this step, exactly
      #   fails('node scripts/mutation-check.mjs --only known-survivor')
      #
      # so every push paid for it twice. Measured on 9d66cf6: this step took
      # 13m53s and the gate a further 17m14s, of a 36-minute job. Roughly 780
      # runner-minutes went to `verify` in the first sixteen days of August, and
      # about half of a green run was this one command executed twice.
      #
      # Nothing is lost in coverage — the gate still runs it, plus the two halves
      # this step never ran. What is lost is EARLINESS: a surviving mutation now
      # surfaces at the gate rather than ~14 minutes sooner. That trade only
      # became reasonable at 4608884, when the gate started reporting WHY a row
      # failed instead of only its name; before that, this step was the only
      # place a survivor was ever named.

      # The confidence gate the CC-CMD ceremony asks for, mechanised. Every row
      # runs a real command and takes its score from the exit code, so the total
      # cannot be asserted, only earned. Below 95 fails the build.
      # Per-row confidence: every gate row must have a mutation proving it can
      # fail, and must not consult the clock or the network. A row nothing has
      # shown can fail is a green light, not a guard.
      # "Written but never read back": a public value nothing reads, and the
      # unit conversions ODDS-PROOF makes claims about, now exercised.
      - name: No value is written without being read back
        run: npm run check:unused

      # The F# harness, run under node from the Fable output. Its own self-test
      # runs first and the suite is skipped if that fails, so this step cannot
      # report green on a harness that has been shown blind.
      - name: The F# suite, on the F# harness
        run: npm run check:verify

      # Measured, not asserted from the stylesheet: bounding boxes and computed
      # styles on the real elements, plus the accessible-name half that no CSS
      # can satisfy.
      - name: Games are separated from each other
        run: npm run check:separation

      - name: Every gate row has teeth
        run: npm run check:rows

      # A red main must be visible in the repo, not only in the Actions tab.
      - name: A red main is reported, not softened
        run: npm run check:status

      # Exact per-commit source/outbox correlation over the FULL history — the
      # correlation FIELD's production gate approximates with a 20-commit window
      # and then suppresses the false positives of. Needs full history, hence
      # fetch-depth below.
      #
      # LAST among the pure checks, deliberately. It used to sit mid-suite, and
      # on 2026-08-17 a single violation — c78ad48, one commit that shipped
      # scripts/ with no outbox entry — failed at step 24 and SKIPPED steps 25
      # through 44. The F# suite, the zone checks, the gate rows and every live
      # check went unrun, on every push, for a reason none of them had anything
      # to do with.
      #
      # This check is about history, so it is the one step whose verdict cannot
      # change based on anything the other steps measure, and it is settled the
      # moment a commit is made. Nothing is learned by running it first, and a
      # whole suite is lost when it fails there. It still fails the job — the
      # violation is not softened, only stopped from masking twenty steps.
      #
      # The fail-fast minutes this gives up are negligible: every step above it
      # totals under two minutes.
      - name: Source and outbox changed together, every commit
        run: npm run check:history

      # Beside check:history for the same reason it sits here: both ask whether
      # the written record can be trusted, and neither depends on anything the
      # other steps measure.
      #
      # Rule 74 requires a staged item to state its unblock condition and verify
      # commands. That is a document discipline: it produces a verification a
      # human then has to remember to run. Measured 2026-08-23 -- 55 files across
      # the two repos say STAGED; four things check anything. The gap produced
      # two distinct failures this month, patched separately before anyone saw
      # they were one: a claim whose unblock was a future event nothing
      # re-evaluated (closing-odds sat two days past its own PASS), and a
      # verification written and never run for six days.
      #
      # This makes a staged claim name an executor that exists and is scheduled.
      # It does NOT make that executor honest -- a probe can run and still lie,
      # which is a different defect with a different fix (baselines).
      - name: A staged claim names a verifier that exists and runs
        run: npm run check:staged-verifier

      # A confidence score in an outbox entry must be a measurement, not a claim.
      #
      # confidence.mjs already says of its ROWS that "a self-reported number is
      # not evidence of anything" and takes every one from an exit code. The
      # SCORE then left that process as console output and was re-typed into
      # markdown by hand, where it was free again. On 2026-08-17 three entries
      # carried scores — 85, 95, 95 — that no gate run produced, two of them
      # landing on the bar with the missing points described as "the runner has
      # not confirmed yet", which is an unfinished task, not doubt.
      #
      # An entry may state no score at all; most are reports rather than commits
      # of source, and forcing a number onto them would manufacture exactly the
      # free numbers this refuses. If it states one, it must cite a full gate run
      # in docs/confidence-log.jsonl and agree with it — including on the
      # denominator, on the absence of failing rows, and on not rounding up to
      # the bar (95% of 530 is 503.5, and Math.round hands 503 the bar).
      #
      # Beside check:history deliberately: both are about whether the record can
      # be trusted, and neither can be answered by anything the steps above
      # measure.
      - name: A confidence score is measured, not asserted
        run: npm run check:confidence-record

      # Hash-pinned tripwire for credentials known to be exposed. It exists
      # because a refusal is a promise and a promise does not scan files: across
      # this project I said repeatedly that the relay's X-FIELD-Relay value would
      # not be copied into laboratory, while 41f0b33 had already written it out
      # in full inside docs/JLAYER-PLAN.md — in the sentence explaining that it
      # is write-capable against the production briefs table.
      #
      # docs/exposed-secrets.sha256 holds hashes only. This hashes candidate
      # tokens from every tracked file and compares, so the pinned list never
      # needs the plaintext and a failure names the credential by description.
      #
      # It does NOT purge history and does not pretend to: the value is still
      # readable at 41f0b33, and only rotation ends that.
      - name: No tracked file carries a known-exposed credential
        run: npm run check:secrets

      # Importing a module must not run it. Three scripts here did their real
      # work and called process.exit at import time, which silently swallowed a
      # probe on 2026-08-17: the import ran the checker, exited 0, and every line
      # after it never executed. The output was plausible and measured nothing.
      #
      # Tested with a sentinel printed AFTER the import rather than by checking
      # for output, because a module that exits 0 silently is indistinguishable
      # from a clean import — and that was the actual case.
      - name: Importing a module never runs it
        run: npm run check:import-purity


      # The two checks above are pinned to committed captures so their
      # assertions are deterministic. This one exercises the path the DEPLOYED
      # page actually takes: fetch today's real slate from the relay and render
      # it. A runner has unrestricted egress, so the fetch genuinely succeeds
      # here — the sandbox where this repo is developed cannot reach the relay,
      # which is exactly why it needs proving in CI rather than locally.
      #
      # Safe on an empty day: the card assertion compares against the decoded
      # game count rather than requiring at least one.
      - name: Render check against the LIVE slate
        run: |
          for i in $(seq 1 20); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          npm run check:live -- --tolerate-unreachable

      # data/pick-2026-07-07.json was TRANSCRIBED from a Drive document rather
      # than fetched — the dev sandbox has no route to the relay. This is where
      # that transcription meets the real route. An HTTP failure is reported and
      # not fatal (the bundle may not exist for a given date); a 200 the decoder
      # cannot read is fatal, which is the actual assertion.
      - name: Pick decoder against the LIVE analytics route
        run: npm run check:pick-live

      # The transcription, checked against its own source. Requests the same
      # date data/pick-2026-07-07.json was copied from and compares the two
      # boards field by field — the only thing that can tell a faithful
      # transcription from a plausible one.
      - name: Pick shape — the transcription vs the real relay
        run: npm run check:pick-shape

      # The GitHub-API read behind STATUS.md's "did the suite pass on main?"
      # section, executed for real. It shipped unexercised — no route to
      # api.github.com from the dev sandbox — and was docked for it. A runner has
      # the token and the egress, so it runs, and it runs in both directions: a
      # real token and a deliberately broken one, required to answer differently.
      # Open-Meteo, for real. This sandbox's egress blocks api.open-meteo.com —
      # the same wall playground hit, which is why it verified CORS from a runner
      # rather than locally. Both directions: a real request and an out-of-range
      # latitude, required to answer differently.
      # `--tolerate-unreachable`: api.open-meteo.com became unreachable from
      # GitHub-hosted runners on 2026-08-12 and turned main red on three
      # consecutive commits whose only fault was existing at the time. verify
      # answers "is this commit correct"; drift-sentinel runs the SAME check
      # without the flag, daily, and there an outage is the finding.
      - name: Weather against the LIVE Open-Meteo API
        run: node scripts/weather-live-check.mjs --tolerate-unreachable

      - name: Status read against the LIVE GitHub API
        run: npm run check:status-live
        env:
          GITHUB_TOKEN: ${{ github.token }}
