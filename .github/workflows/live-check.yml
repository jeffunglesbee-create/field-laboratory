# Renders the DEPLOYED page and asserts it actually works.
#
# The gap this closes: `verify` runs every check against a local server, and
# `deploy` publishes if `verify` was green. Nothing looked at the published
# artifact. A deploy that shipped a broken or stale bundle would have left the
# whole pipeline green — and this project's recorded history includes three
# blank artifacts shipped on the strength of everything upstream looking
# healthy, which is exactly this failure shape.
#
# `probe-url` cannot answer this: it curls, so it sees the HTML shell. The page
# is client-rendered, so the shell is identical whether the cards render or the
# bundle throws on load.
name: live-check

on:
  # Every deploy verifies itself. This is the point — a manual-only check is one
  # nobody runs on the deploy that actually breaks.
  workflow_run:
    workflows: [deploy]
    types: [completed]
  workflow_dispatch:
  # A daily beat catches the other direction: the artifact is fine but the
  # relay's shape moved under it.
  #
  # MOVED 2026-08-31 from '37 6 * * *' to an evening-ET hour, and the reason is
  # that the old one could never exercise half this job.
  #
  # 06:37 UTC is 02:37 in FIELD's zone. The page renders the CURRENT ET day, and
  # at 02:37 that day is two and a half hours old with no fixtures on it. So the
  # daily run met an empty slate every time. Until today that surfaced as a raw
  # TimeoutError; now it is correctly reported NOT OBSERVABLE — which is honest
  # and still means the brief-phase rule, live-grouping and the schedule rows
  # were never tested by the schedule, only by deploys.
  #
  # 03:37 UTC is 23:37 EDT and 22:37 EST — evening ET in both halves of the
  # year, with the day's early fixtures final and carrying recaps. That is the
  # state these checks are written for.
  #
  # Same one run a day. The cost is identical and the coverage is not.
  schedule:
    - cron: '37 3 * * *'

# ADDED 2026-10-08, for one step: committing the axis widths to outbox/.
#
# This workflow declared no `permissions:` block at all for its whole life, and
# scripts/axis-check.mjs described that as "read-only by design". No block means
# the token takes the REPOSITORY default, which is a setting and not a design —
# so the claim was unverified, and the endpoint that reports it
# (actions/permissions/workflow) is one the authoring sandbox's proxy refuses.
# Declaring it is what makes the answer readable from the file.
#
# Narrow on purpose: `contents` only, and every other step here is a read.
permissions:
  contents: write

concurrency:
  group: live-check
  cancel-in-progress: true

jobs:
  live:
    # Only when the triggering deploy actually DEPLOYED.
    #
    # `workflow_run` fires on completion, and a SKIPPED deploy completes. On
    # 2026-08-11 that produced a false failure: deploy skipped at 531b0a8
    # (its own trigger, a verify run, had been cancelled), live-check ran anyway
    # against the artifact still live from 69f02ef, and reported an ADR-002
    # violation against a commit whose whole purpose was fixing it. The code
    # under test was never on the page.
    #
    # `deploy` already guards itself this way; this workflow inherited the
    # trigger without the guard. Scheduled and manual runs are unaffected —
    # there is no deploy conclusion to consult.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Full history: deploy-landed-check walks commits back to the newest
      # DEPLOYABLE one, which may be behind HEAD when docs/[skip ci] commits sit
      # on top. A shallow clone would see one commit and misjudge.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # render-check imports the compiled venue table (build/Venues.js) to derive
      # how many weather chips this slate SHOULD carry. Without a build that is a
      # module-not-found at step 4, and `check:workflows` caught it here before
      # any run did — which is the whole reason that guard exists. The build is
      # of THIS commit; the page under test is the deployed one, and the stamp
      # check above is what keeps those the same commit.
      - name: Build (the venue table this check derives its expectation from)
        run: |
          dotnet tool restore
          npm run build

      - name: The deployed build stamp matches main
        id: stamp
        run: |
          SITE=https://field-laboratory.jeffunglesbee.workers.dev
          DEPLOYED=$(curl -sSf --max-time 30 "$SITE/version.txt" | tr -d '[:space:]')
          HEAD_SHA=$(git rev-parse HEAD)
          echo "deployed: $DEPLOYED"
          echo "main:     $HEAD_SHA"
          if [ "$DEPLOYED" != "$HEAD_SHA" ]; then
            # Not automatically a failure — a docs-only commit correctly never
            # deploys — but the render assertions below are then describing an
            # older artifact, so say so rather than let the run imply otherwise.
            echo "::warning::Deployed stamp is not main HEAD; checks below describe $DEPLOYED"
          fi
          echo "sha=$DEPLOYED" >> "$GITHUB_OUTPUT"

      # The deploy landed: the published artifact is the newest DEPLOYABLE commit.
      # This is the assertion the laboratory lacked — it could report the stamp
      # was "not main HEAD" but not tell whether that was correct (a docs commit
      # on top) or a failed deploy. --strict, because by the time live-check runs
      # the triggering deploy has completed, so "behind" is a real failure, not a
      # mid-flight transient. On the daily schedule and manual runs it is equally
      # true that the newest deployable commit should be live.
      - name: The deploy landed (published is the newest deployable commit)
        id: landed
        run: SITE=https://field-laboratory.jeffunglesbee.workers.dev node scripts/deploy-landed-check.mjs --strict

      # EVERY PAGE ASSERTION RUNS, EVEN AFTER ONE FAILS.
      #
      # These five describe the SAME deployed page and none depends on another,
      # but a failing step ends the job, so a run reported exactly ONE of them.
      # That is arithmetic, not luck, and it cost seven rounds on 2026-08-31: an
      # empty slate (00:xx ET, no fixtures yet) met assertion after assertion
      # that had never seen one, and each ~6-minute run revealed a single new
      # instance. brief-phase, then Scout's Pick, then the stats cards.
      #
      # `!cancelled()` rather than `always()`: a cancelled run has nothing to say.
      #
      # AND GATED ON `landed`, WHICH IS THE POINT OF NOT USING always(). Steps 1
      # and 2 do not assert about the page — they establish WHICH artifact the
      # page is. If the published commit is behind the newest deployable one,
      # every assertion below describes some other build, and running them
      # anyway would produce five confident findings about the wrong bytes.
      # Fail-fast is correct there and wrong here.
      - name: Render the deployed page and assert on it
        # Runs even if a SIBLING assertion failed, but not if the artifact under
        # test is unknown — see the block above `Render the deployed page`.
        if: "!cancelled() && steps.landed.outcome == 'success'"
        run: URL=https://field-laboratory.jeffunglesbee.workers.dev/ node scripts/render-check.mjs

      # THE TINTS, ON THE PAGE THAT IS ACTUALLY SERVED.
      #
      # `check:team-tints` runs in verify against localhost, which proves the
      # BUILT page and not the deployed one. This repo's own record of why that
      # gap matters is the Bundesliga case in CLAUDE.md: behaviour read off a
      # local build was attributed to the source, the build predated the commit,
      # and the tell was a single separator character. `public/` is a copy;
      # `build/` is a copy; the worker's response is the only thing that is not.
      #
      # Pinned to the frozen capture, which `build-site.mjs` copies into
      # `public/data` and the worker serves at the same path — so the count here
      # is the same 62 verify asserts, measured one hop further out.
      - name: Team tints on the DEPLOYED page
        if: "!cancelled() && steps.landed.outcome == 'success'"
        run: |
          URL='https://field-laboratory.jeffunglesbee.workers.dev/?data=context-2026-08-29' \
            node scripts/team-tint-render-check.mjs

      # THE SAME SCRIPT AS verify's, one hop further out. verify proves the axis
      # on the build this runner just made; this proves it on the bytes the
      # owner's browser downloads — a variable face can be correct in public/
      # and absent from the deployed asset, and only this step can tell.
      - name: The score's weight axis interpolates on the DEPLOYED page
        id: axis
        if: "!cancelled() && steps.landed.outcome == 'success'"
        env:
          # The commit the widths describe, from the stamp step's own read of
          # /version.txt — the published artifact, not this runner's HEAD. Absent
          # it the manifest records `null`, which is a different fact from a
          # commit that happened to be empty.
          DEPLOYED_SHA: ${{ steps.stamp.outputs.sha }}
        run: |
          node scripts/axis-check.mjs --self-test
          URL='https://field-laboratory.jeffunglesbee.workers.dev/' \
            node scripts/axis-check.mjs --manifest

      - name: The deployed page groups by sport
        # Runs even if a SIBLING assertion failed, but not if the artifact under
        # test is unknown — see the block above `Render the deployed page`.
        if: "!cancelled() && steps.landed.outcome == 'success'"
        run: |
          # render-check counts cards; it does not know about sections. On a
          # real multi-sport day the live slate must come back grouped, which is
          # the feature this workflow exists to keep honest in production.
          node scripts/live-grouping-check.mjs

      # Both pick tabs, on the DEPLOYED artifact. Structural assertions only —
      # tab-check.mjs pins ?data= and checks for teams by name, none of which
      # holds against tonight's real slate.
      # The phase rule, against the page a person opens rather than a fixture.
      # verify proves it on data/brief-recency-corpus.json and on a local server;
      # both are copies. This fetches the same /context/date the page fetched,
      # computes what the rule says each final game should show, and asserts the
      # DOM agrees — the shape the stale Bundesliga build slipped through.
      #
      # Three-state: no final game carrying both phases is NOT OBSERVABLE, warned
      # and not counted as a pass.
      - name: A finished game shows the brief written after it finished
        # Runs even if a SIBLING assertion failed, but not if the artifact under
        # test is unknown — see the block above `Render the deployed page`.
        if: "!cancelled() && steps.landed.outcome == 'success'"
        run: |
          node scripts/brief-phase-live-check.mjs --self-test
          URL=https://field-laboratory.jeffunglesbee.workers.dev/ node scripts/brief-phase-live-check.mjs

      - name: The deployed page serves both pick tabs
        # Runs even if a SIBLING assertion failed, but not if the artifact under
        # test is unknown — see the block above `Render the deployed page`.
        if: "!cancelled() && steps.landed.outcome == 'success'"
        run: npm run check:live-tabs

      - name: The pitcher and records rows appear on the deployed page
        # Runs even if a SIBLING assertion failed, but not if the artifact under
        # test is unknown — see the block above `Render the deployed page`.
        if: "!cancelled() && steps.landed.outcome == 'success'"
        # Against the DEPLOYED page, not a local server: this is the only
        # configuration where the schedule fetch runs at all — a page pinned to
        # `?data=` renders a committed capture and must never reach the network,
        # which is what keeps every offline render check free of a third-party
        # request.
        #
        # Needs live statsapi, which the agent sandbox is 403 at the proxy for.
        # That is the whole reason this step exists here rather than in the gate.
        #
        # Does NOT fail on a slate with no MLB games — it reports and asserts
        # nothing, because "no baseball today" is a fact about the day.
        run: URL=https://field-laboratory.jeffunglesbee.workers.dev/ node scripts/schedule-live-check.mjs

      # THE WIDTHS, IN THE TREE. The run log has them too, and that turned out
      # not to be enough: `runs/<id>/logs` answers with a redirect to blob
      # storage which the authoring sandbox's GitHub client refuses, so for three
      # days the proof that the axis interpolates was a green step conclusion
      # whose numbers could not be quoted. Anything that can read the repository
      # can read an artifact in it.
      #
      # Runs when the axis step ran at all, pass or fail — a run whose widths
      # came back equal is exactly the run whose numbers are wanted.
      #
      # Quiet by construction: the manifest carries no wall-clock field, so a run
      # that re-measures an unchanged page and finds the same widths stages
      # nothing and commits nothing. Same rule as status.yml's STATUS.md step,
      # and the same reason — "its git history should read as a log of things
      # happening, not one commit a day saying nothing".
      #
      # outbox/ is in verify.yml's paths-ignore and in deployable.mjs's
      # `isIgnored`, so this commit triggers no workflow and does not become the
      # newest deployable commit — it cannot retrigger the check that wrote it.
      #
      # LAST IN THE JOB, after every page assertion, because `git pull --rebase`
      # rewrites the working tree. The steps below it read source — the grouping
      # check, the brief-phase rule, the pick tabs — while `build/` is gitignored
      # and survives a rebase untouched. Had this sat where the axis step is, a
      # concurrent push to main would have left those checks reading one source
      # and asserting against a build of another, which is this repo's recorded
      # Bundesliga failure in a new place.
      - name: Commit the measured widths
        if: "!cancelled() && steps.axis.outcome != 'skipped'"
        run: |
          MANIFEST=outbox/axis-manifest-latest.json
          if [ ! -f "$MANIFEST" ]; then
            # Three distinct facts, not one. A PASSING axis check that wrote
            # nothing means --manifest stopped reaching the script, which is a
            # green check publishing no evidence. A FAILING one means the page
            # never rendered and there was nothing to measure; that is already
            # reported by the step above and does not need a second red.
            if [ "${{ steps.axis.outcome }}" = 'success' ]; then
              echo "::error::the axis check passed and wrote no $MANIFEST"
              exit 1
            fi
            echo "::warning::no $MANIFEST — the axis check failed before measuring; see the step above"
            exit 0
          fi
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add "$MANIFEST"
          if git diff --staged --quiet; then
            echo "::notice::same deployed commit, same widths — nothing to commit"
            exit 0
          fi
          git commit -m "probe: the score's weight axis on the deployed page [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      # The window simulation (npm run check:window) does NOT live here. It runs
      # in `verify`, which also has relay egress.
      #
      # This comment used to read "this job has no .NET and no build step by
      # design". That stopped being true at ed701a6, when render-check began
      # importing build/Venues.js to derive the weather-chip expectation and this
      # job gained a build. The stale sentence is what made the consequence
      # invisible: `workflow-check` keys on `npm run build` appearing anywhere in
      # a job, so the moment this job built, the mutation guarding that rule went
      # silent and SURVIVED (CI run 31551408060). It now lives on status.yml,
      # which is build-free by nature. Recording why, because deleting a false
      # premise without its reason invites the same rot.
