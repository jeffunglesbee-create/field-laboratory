# Deploys the same public/ to GitHub Pages using ZERO secrets.
#
# THE POINT, which is a design change rather than a workaround:
#
# An automated deploy needs a credential the runner can obtain without a human.
# There are exactly two kinds. A stored secret — which a session cannot write,
# because the GitHub proxy refuses the Actions secrets path by design
# (403, verified) and should not be handed a live credential anyway. Or the
# runner's OWN identity, via OIDC, which needs no secret at all.
#
# Cloudflare does not federate GitHub OIDC into an API token, so that path
# always requires a human to place a token once. GitHub Pages accepts the
# runner's OIDC identity natively. So pointing at a deploy target that already
# trusts the runner removes the blocker entirely rather than defeating it.
#
# This does NOT replace the Cloudflare deploy. It is a second, independent
# target so there is a live page now; deploy.yml still publishes to workers.dev
# the moment its token exists.
name: pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  # Re-checks whether Pages has been switched on, so this becomes live on its
  # own once it is. Costs a few seconds while it is off.
  schedule:
    - cron: '47 * * * *'

# The three grants that replace a secret. id-token is what lets the runner
# prove who it is to the Pages deployment API.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      # Checked BEFORE building, so a disabled Pages site costs seconds rather
      # than a full .NET + Fable build.
      #
      # `configure-pages` with enablement: true cannot create the site itself:
      # GITHUB_TOKEN is refused with "Create Pages site failed. Error: Resource
      # not accessible by integration". `pages: write` grants DEPLOYING to
      # Pages, not CREATING the Pages site — that is deliberately not grantable
      # to a workflow token. So the one-time switch-on is a human action, and
      # every deploy after it needs no secret at all.
      - name: Is Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CODE=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/pages" || echo 000)
          echo "GET /pages -> $CODE"
          if [ "$CODE" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Pages deploy skipped — Pages is not switched on"
              echo
              echo 'Enable it once at **Settings → Pages → Build and deployment → Source: GitHub Actions**.'
              echo
              echo 'A workflow token cannot do this itself: `pages: write` grants deploying to Pages,'
              echo 'not creating the Pages site. After that one click this workflow publishes on every'
              echo 'green `verify`, with **no secret of any kind**.'
              echo
              echo 'Note: Pages on a *private* repository requires a paid GitHub plan.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Pages not enabled — skipping. Enable at Settings → Pages → Source: GitHub Actions."
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        if: steps.pages.outputs.enabled == 'true'
        with:
          node-version: '22'

      - name: Build
        if: steps.pages.outputs.enabled == 'true'
        run: |
          npm ci
          dotnet tool restore
          npm run build

      - name: Verify the built site before publishing it
        if: steps.pages.outputs.enabled == 'true'
        run: |
          test -s public/index.html
          test -s public/build/Program.js
          test -s public/vendor/solid.js
          test -s public/version.txt
          echo "public/: $(find public -type f | wc -l) files"

      # No enablement here — see the check above for why a workflow token
      # cannot create the site. This only reads the existing configuration.
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: public

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Confirm the deployed page actually serves
        run: |
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "page_url: $URL"
          for i in 1 2 3 4 5 6; do
            CODE=$(curl -sSL --max-time 20 -o /tmp/body -w '%{http_code}' "$URL" || echo 000)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 10
          done
          test "$CODE" = "200"
          # A 200 alone is not proof — assert the real page shipped.
          grep -q 'FIELD Laboratory' /tmp/body
          {
            echo "### Deployed to GitHub Pages"
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
