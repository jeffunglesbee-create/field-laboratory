# Builds the page and deploys it to Cloudflare Workers.
#
# Self-completing: when CLOUDFLARE_API_TOKEN is absent this workflow SKIPS
# cleanly rather than failing, and a schedule re-checks periodically. So the
# moment the secret is added the site deploys on its own — nobody has to come
# back and re-run anything.
#
# Skipping rather than failing is deliberate. An unconfigured deploy is not a
# broken build, and a workflow that goes red on every push until someone pastes
# a secret trains you to ignore red, which is worse than the gap it reports.
# The skip is loud in the summary instead.
name: deploy

on:
  # Only after `verify` has passed on main. Triggering both on push would let a
  # broken page ship while its own checks were still failing.
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  # Re-check for the secret, and re-publish if the live site is behind main.
  # Costs ~10s when there is nothing to do, because the job compares the
  # deployed build stamp against HEAD before building anything.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is deployment configured?
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped — not configured yet"
              echo
              echo '`CLOUDFLARE_API_TOKEN` is not set on this repository.'
              echo
              echo 'Add it at **Settings → Secrets and variables → Actions → New repository secret**.'
              echo 'The token needs **Workers Scripts: Edit**.'
              echo 'Add `CLOUDFLARE_ACCOUNT_ID` too only if the token can reach more than one account.'
              echo
              echo 'This workflow re-checks hourly, so the site will deploy by itself once the secret exists.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::Deploy skipped — CLOUDFLARE_API_TOKEN not set. Will retry on schedule."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Is the live site already on this commit?
        id: live
        if: steps.token.outputs.configured == 'true'
        run: |
          URL=https://field-laboratory.jeffunglesbee.workers.dev/version.txt
          LIVE=$(curl -sSL --max-time 20 "$URL" 2>/dev/null | tr -d '[:space:]' || true)
          echo "live=$LIVE  head=$GITHUB_SHA"
          if [ "$LIVE" = "$GITHUB_SHA" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Live site is already on $GITHUB_SHA — nothing to deploy."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.token.outputs.configured == 'true' && steps.live.outputs.current != 'true'
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.configured == 'true' && steps.live.outputs.current != 'true'
        with:
          node-version: '22'

      - name: Build
        if: steps.token.outputs.configured == 'true' && steps.live.outputs.current != 'true'
        run: |
          npm ci
          dotnet tool restore
          npm run build

      - name: Verify the built site before publishing it
        if: steps.token.outputs.configured == 'true' && steps.live.outputs.current != 'true'
        run: |
          test -s public/index.html
          test -s public/build/Program.js
          test -s public/vendor/solid.js
          test -s public/data/context-2026-05-15.json
          test -s public/version.txt
          echo "public/ looks complete: $(find public -type f | wc -l) files"

      - name: Deploy
        if: steps.token.outputs.configured == 'true' && steps.live.outputs.current != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Confirm the deployed page actually serves
        if: steps.token.outputs.configured == 'true' && steps.live.outputs.current != 'true'
        run: |
          URL=https://field-laboratory.jeffunglesbee.workers.dev
          for i in 1 2 3 4 5; do
            CODE=$(curl -sSL --max-time 20 -o /tmp/body -w '%{http_code}' "$URL" || echo 000)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          test "$CODE" = "200"
          # A 200 is not enough — an assets Worker with an empty directory also
          # returns 200. Assert the real page actually shipped.
          grep -q 'FIELD Laboratory' /tmp/body
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed and serving: $URL"
