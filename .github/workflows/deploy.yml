# Builds the page and deploys it to Cloudflare Workers.
#
# Self-completing: when CLOUDFLARE_API_TOKEN is absent this workflow SKIPS
# cleanly rather than failing, and a schedule re-checks periodically. So the
# moment the secret is added the site deploys on its own — nobody has to come
# back and re-run anything.
#
# Skipping rather than failing is deliberate. An unconfigured deploy is not a
# broken build, and a workflow that goes red on every push until someone pastes
# a secret trains you to ignore red, which is worse than the gap it reports.
# The skip is loud in the summary instead.
name: deploy

on:
  # Only after `verify` has passed on main. Triggering both on push would let a
  # broken page ship while its own checks were still failing.
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [main]
  # Re-check for the secret, and re-publish if the live site is behind main.
  # Costs ~10s when there is nothing to do, because the job compares the
  # deployed build stamp against HEAD before building anything.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# Declared, not inherited. This workflow had no `permissions:` block at all, so
# it ran on whatever the repository default happens to be — and live-check.yml's
# own block carries the note this follows: an undeclared default is a setting,
# not a design. Narrow on purpose: the deploy authenticates to Cloudflare with a
# SECRET, not with this token, and makes no git write. `actions: read` is new and
# is the one thing the verify gate below needs.
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Full history: the verify gate below asks about the newest DEPLOYABLE
      # commit, and `newestDeployableCommit()` walks `git log` to find it. On a
      # shallow clone it returns null, and a null sha would drop the head_sha
      # filter and answer about whatever verify ran last — the exact defect the
      # gate exists to fix. The script refuses to guess in that case; this makes
      # sure it never has to.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Is deployment configured?
        id: token
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Presence-only probes for the names this is most often saved under.
          # These expand to a value the runner masks; the script below tests
          # ONLY whether each is empty and never echoes one. That turns
          # "not set" — which is a dead end — into "not set, but here is what
          # IS set", which is actionable.
          ALT_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          ALT_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          ALT_CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          ALT_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "configured=false" >> "$GITHUB_OUTPUT"

          FOUND=""
          [ -n "$ALT_CLOUDFLARE_TOKEN" ] && FOUND="$FOUND CLOUDFLARE_TOKEN"
          [ -n "$ALT_CF_API_TOKEN" ] && FOUND="$FOUND CF_API_TOKEN"
          [ -n "$ALT_CLOUDFLARE_API_KEY" ] && FOUND="$FOUND CLOUDFLARE_API_KEY"
          [ -n "$ALT_ACCOUNT_ID" ] && FOUND="$FOUND CLOUDFLARE_ACCOUNT_ID"

          {
            echo "### Deploy skipped — CLOUDFLARE_API_TOKEN is not visible to Actions"
            echo
            if [ -n "$FOUND" ]; then
              echo "**A differently-named secret IS set:**\`$FOUND\`"
              echo
              echo 'Rename it to `CLOUDFLARE_API_TOKEN`, or tell me and I will change'
              echo 'the workflow to read the name you used.'
            else
              echo 'No Cloudflare-ish secret is visible under any of the names checked.'
              echo
              echo 'The usual cause is the **wrong tab**. That settings page has three'
              echo 'separate stores — **Actions**, Codespaces, and Dependabot — and only'
              echo 'the Actions one reaches a workflow. A secret saved under Codespaces or'
              echo 'Dependabot is invisible here.'
              echo
              echo 'Check: **Settings → Secrets and variables → Actions**, the'
              echo '*Repository secrets* section, named exactly `CLOUDFLARE_API_TOKEN`.'
              echo 'Also confirm it landed on **this** repository.'
            fi
            echo
            echo 'Re-checks hourly; no re-run needed once it is in the right place.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::CLOUDFLARE_API_TOKEN not visible to Actions.${FOUND:+ Found instead:$FOUND}"

      # THE VERIFY GATE, and it applies to the hourly `schedule` only.
      #
      # Measured 2026-10-10: verify was FAILURE on 2000641 while this workflow
      # deployed 7a9f48f on a schedule trigger, and live-check then failed on
      # it. The day before, main equally red, the job SKIPPED — because that
      # day's trigger was workflow_run from a failed verify. Same red main,
      # opposite outcomes, decided by which trigger happened to fire.
      #
      # workflow_run is NOT gated here: the job-level `if` above already
      # required verify success, and that condition is correct.
      #
      # workflow_dispatch is NOT gated, DELIBERATELY. A human asking for a
      # deploy is a human overriding this on purpose, and the dispatch is
      # recorded in the run history. Gating it would remove the only manual
      # route to publishing a known-red commit, which is sometimes the right
      # thing to do.
      #
      # Skips, never fails — the same reason the token step above skips. The red
      # already exists, on verify, where it belongs; a second red here would
      # train everyone to ignore both.
      - name: Does verify allow this deploy?
        id: gate
        if: steps.token.outputs.configured == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/deploy-gate.mjs --self-test
          node scripts/deploy-gate.mjs

      - name: Is the live site already on this commit?
        id: live
        if: steps.token.outputs.configured == 'true' && steps.gate.outputs.proceed == 'true'
        run: |
          URL=https://field-laboratory.jeffunglesbee.workers.dev/version.txt
          LIVE=$(curl -sSL --max-time 20 "$URL" 2>/dev/null | tr -d '[:space:]' || true)
          echo "live=$LIVE  head=$GITHUB_SHA"
          if [ "$LIVE" = "$GITHUB_SHA" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Live site is already on $GITHUB_SHA — nothing to deploy."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-dotnet@v4
        if: steps.token.outputs.configured == 'true' && steps.gate.outputs.proceed == 'true' && steps.live.outputs.current != 'true'
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.configured == 'true' && steps.gate.outputs.proceed == 'true' && steps.live.outputs.current != 'true'
        with:
          node-version: '22'

      - name: Build
        if: steps.token.outputs.configured == 'true' && steps.gate.outputs.proceed == 'true' && steps.live.outputs.current != 'true'
        run: |
          npm ci
          dotnet tool restore
          npm run build

      - name: Verify the built site before publishing it
        if: steps.token.outputs.configured == 'true' && steps.gate.outputs.proceed == 'true' && steps.live.outputs.current != 'true'
        run: |
          test -s public/index.html
          test -s public/build/Program.js
          test -s public/vendor/solid.js
          test -s public/data/context-2026-05-15.json
          test -s public/version.txt
          echo "public/ looks complete: $(find public -type f | wc -l) files"

      - name: Deploy
        if: steps.token.outputs.configured == 'true' && steps.gate.outputs.proceed == 'true' && steps.live.outputs.current != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Confirm the deployed page actually serves
        if: steps.token.outputs.configured == 'true' && steps.gate.outputs.proceed == 'true' && steps.live.outputs.current != 'true'
        run: |
          URL=https://field-laboratory.jeffunglesbee.workers.dev
          for i in 1 2 3 4 5; do
            CODE=$(curl -sSL --max-time 20 -o /tmp/body -w '%{http_code}' "$URL" || echo 000)
            echo "attempt $i: HTTP $CODE"
            [ "$CODE" = "200" ] && break
            sleep 5
          done
          test "$CODE" = "200"
          # A 200 is not enough — an assets Worker with an empty directory also
          # returns 200. Assert the real page actually shipped.
          grep -q 'FIELD Laboratory' /tmp/body
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployed and serving: $URL"
