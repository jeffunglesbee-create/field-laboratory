name: capture tennis fixture

# Dispatch-only, NO schedule. A fixture is captured when a shape needs
# modelling, not on a timer. CI because the sandbox 403s *.workers.dev.
#
# Capture WHILE PLAY IS ON. The script refuses an empty draw and refuses a
# payload where no match carries sets_detail — that array is the entire reason
# tennis is being modelled, and a fixture without one would leave the decoder
# verified against nothing while looking captured.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Capture
        run: node scripts/capture-tennis-fixture.mjs
      - name: Commit the fixture
        run: |
          git config user.email "claude@field.dev"
          git config user.name "FIELD CI"
          git add data/tennis-live.json data/PROVENANCE.md
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "fixture: capture a real live tennis payload [skip ci]"
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin main && break
            sleep $((i * 5))
          done
