# Phase 1's writer — one modelled three-way per scheduled EPL fixture, written
# as a row to the append-only store.
#
# WHY CI: the sandbox reaches neither *.workers.dev nor
# fantasy.premierleague.com (HTTP 000 on both, measured 2026-10-03), and the
# model is Fable output that has to be built first.
#
# TWICE A DAY, AND THAT IS THE DONE CONDITION, not a cadence preference. The
# CC-CMD requires "two observations of the same subject recorded on DIFFERENT
# RUNS", because one observation proves nothing about a record. Two scheduled
# runs produce the second row and the first real diff.
#
# THE DRY RUN IS THE DEFAULT UNTIL THE STORE EXISTS. `forecast_observations` is
# not yet in field-relay-nba's ALLOWED_TABLES, so every INSERT returns 403; the
# writer names that file and line in its error path rather than appearing to
# succeed. Flip `write` to true once the entry is deployed.
name: forecast-run

on:
  workflow_dispatch:
    inputs:
      write:
        description: 'Write rows to D1 (needs forecast_observations allow-listed)'
        type: boolean
        default: false
  schedule:
    - cron: '41 6,18 * * *'

permissions:
  contents: write

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # `dotnet tool restore` is not optional: Fable is a dotnet LOCAL tool and
      # `npm run build` shells out to it.
      - name: Install
        run: |
          npm ci
          dotnet tool restore

      # The store's SQL first, on a real SQLite. If append-only does not hold
      # there is no point writing a row to find out.
      - name: The store cannot overwrite an observation
        run: node scripts/check-forecast-store.mjs

      - name: Build the model
        run: npm run build

      # A scheduled run is a DRY RUN until the input says otherwise, so the
      # cron cannot start writing the day the allow-list entry lands without
      # someone deciding it should.
      # `set -o pipefail` IS LOAD-BEARING. A pipeline's exit code is its LAST
      # command, so `node ... | tee` reports tee's success and the step goes
      # green over a crashed writer. Measured on the first run: the import of
      # METHOD threw, nothing was written, and this step said success.
      - name: Forecast
        shell: bash
        env:
          RELAY_SHARED_SECRET: ${{ secrets.RELAY_SHARED_SECRET }}
        run: |
          set -o pipefail
          node scripts/forecast-run.mjs ${{ inputs.write == true && ' ' || '--dry-run' }} \
            2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the artifact
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add outbox/forecast-dry-run-latest.json || true
          git add outbox/forecast-store-latest.json || true
          git diff --staged --quiet || git commit -m "forecast: run $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
