# Does a club's ALTERNATE colour recover a card that renders plain?
#
# 36 of 78 cards on the frozen capture tint. Thirty of the remaining 42 fail on
# colour alone — 12 where one side's brand is white and reads as the page's own
# text colour, 18 where both read but are closer than the separation floor.
# `generate-team-colours.mjs` already fetches every club's `alternateColor` and
# the table stores only the primary.
#
# This measures whether using it per card would recover those thirty, before any
# of it is built. It reports only colours ESPN actually serves: a third colour
# that is true but unsourced is the fabrication this project refuses.
#
# WHY CI: site.api.espn.com is outside the dev sandbox's egress allowlist.
# DISPATCH ONLY — it is a diagnostic, not a gate.
name: alternate colour probe

on:
  workflow_dispatch:
    inputs:
      capture:
        description: Frozen capture to score (data/<name>.json)
        default: context-2026-08-29

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install
        run: |
          npm ci
          dotnet tool restore

      # The probe scores candidates through `Palette.teamTint`, `readsAsColour`
      # and `distinguishable` from build/, so the acceptability predicate is the
      # page's own and not a copy of it.
      - name: Build
        run: npm run build

      - name: Probe
        run: |
          node scripts/probe-alternate-colours.mjs --self-test
          node scripts/probe-alternate-colours.mjs --capture "${{ inputs.capture || 'context-2026-08-29' }}" \
            | tee outbox/alternate-colours-console.txt

      - name: Commit the reading
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add outbox
          if git diff --staged --quiet; then
            echo "nothing to commit"; exit 0
          fi
          node scripts/staged-outbox-check.mjs
          git commit -m "probe: alternate colours against the frozen capture [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
