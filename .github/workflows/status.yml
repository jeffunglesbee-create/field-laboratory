# Keeps STATUS.md answering "where does everything stand?" without anyone
# reading four workflows.
#
# It exists because that question kept being asked out loud — is the page up,
# did the secret land, has the sentinel found anything — and answering it meant
# opening run logs. Now the repo answers it.
#
# Runs after either deploy workflow finishes, so the file is current within a
# minute of anything actually changing, plus a slow schedule as a backstop for
# changes made outside CI (a secret added, Pages switched on).
#
# CADENCE CUT 2026-08-16, from `33 */3 * * *` to daily.
#
# The backstop was firing eight times a day. It is a BACKSTOP — the event
# triggers below are what keep STATUS.md current within a minute of a real
# change, and the schedule exists only for changes made outside CI, which are
# rare and not urgent. Eight runs a day to catch "someone added a secret" is
# paying a subscription for a doorbell.
#
# 263 status runs at ~1 minute each is the second-largest line in this repo's
# Actions spend after `verify`, against a budget that was 90% consumed with two
# weeks of the month left. Daily costs ~30 runs a month instead of ~240, and
# costs the event-driven freshness nothing at all.
name: status

on:
  workflow_run:
    # `verify` ADDED 2026-08-29, and gated below rather than run on every push.
    #
    # STATUS.md's first line answers "Did the suite pass on main?" from verify's
    # history. Nothing triggered it on a verify FAILURE: deploy fires only on
    # verify success, and status fired only on deploy -- so a red verify left
    # that line reporting the last green commit until the daily backstop, up to
    # 24 hours later. The file went quiet at precisely the moment it had
    # something to say.
    #
    # Measured 2026-08-29: verify was red on three consecutive commits and the
    # question "is main green" was answered by hand each time, from run logs.
    # That is the reading this file exists to make unnecessary.
    workflows: [deploy, pages, drift-sentinel, verify]
    types: [completed]
  schedule:
    - cron: '33 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  # Reading verify's conclusion for main. The status file is what would have
  # contradicted a false "main is green" claim, and it could not, because it had
  # no way to look.
  actions: read

concurrency:
  group: status
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-latest
    # THE GATE, and it is a budget decision as much as a correctness one.
    #
    # `verify` runs on every push to main -- twelve times on 2026-08-29 alone --
    # and refreshing status after each GREEN one buys nothing: deploy already
    # fires on success and already triggers this workflow. Only the failures are
    # unreported, so only failures are worth a run.
    #
    # This workflow's own header records a cadence cut from 8 runs a day to 1
    # "against a budget that was 90% consumed with two weeks of the month left".
    # An ungated verify trigger would have undone that and more. A skipped job
    # costs seconds and no minutes.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.name != 'verify' ||
      github.event.workflow_run.conclusion == 'failure'
    steps:
      # Full history: the outbox index is read out of git log, and a shallow
      # clone would silently produce a near-empty table.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe and render
        run: node scripts/status.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Which commit wrote which outbox entry, derived from git. It runs here
      # rather than in verify because it describes a commit and so can only be
      # written after that commit exists.
      #
      # `always()`: the step above now FAILS when verify's conclusion could not
      # be read, and it writes the reason into STATUS.md before failing. If these
      # two stopped on that failure, the reason would exist only in a run log —
      # which is how a status file that cannot read history goes on looking fine.
      - name: Regenerate the outbox index
        if: always()
        run: node scripts/outbox-index.mjs

      # Commits only when a real fact changed. STATUS.md carries no timestamp
      # precisely so this stays quiet — its git history should read as a log of
      # things happening, not one commit a day saying nothing.
      - name: Commit if anything changed
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          git add STATUS.md outbox/INDEX.md
          if git diff --staged --quiet; then
            echo "::notice::No change in status."
            exit 0
          fi
          git commit -m "status: refresh [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
