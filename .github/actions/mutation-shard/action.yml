# One shard of the mutation table: build the site, run `mutation-check.mjs --shard i/N`, upload the result.
#
# ONE DEFINITION, THREE USERS. `verify-full.yml` runs eight of these in parallel and its gate row reads them back;
# `mutation-equivalence.yml` runs eight under each build driver. Written three times, the copies would drift, and a
# shard that builds differently from the one it is compared with makes the comparison about the build, not the driver.
#
# The caller checks the repository out first, with FULL HISTORY (`fetch-depth: 0`): the world mutations of the history
# rows walk the log to its root, and a shallow clone would let them pass on one commit. docs/CC-CMD-2026-11-03-gate-speed.md.
name: mutation shard
description: Build the site and run one shard of the mutation table, then upload its result.

inputs:
  index:
    description: Which shard, 1-based. Ignored when `ids` is given.
    required: false
    default: '1'
  of:
    description: How many shards the table is split into. Ignored when `ids` is given.
    required: false
    default: '1'
  ids:
    description: A comma-separated list of mutation ids to run instead of a shard (a targeted probe). Empty means run the shard.
    required: false
    default: ''
  mode:
    description: Build driver, watch or full.
    required: true
  artifact:
    description: Name of the artifact the shard's result is uploaded as.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm

    - name: Install
      shell: bash
      run: |
        npm ci
        dotnet tool restore

    # build-steady.mjs is `npm run build`, repeated when the F# compiler crashes (about 1 build in 100 on the runners; nine builds a gate run).
    # A real failure still fails, with the whole output of its last attempt. docs/CC-CMD-2026-11-03-fable-compiler-crash.md.
    - name: Build (F# -> JS, then assemble public/)
      shell: bash
      run: node scripts/build-steady.mjs

    # THE SHAPE scripts/check-browser-gate.py keeps (this file is one of its targets): the install carries `id: chromium` and `continue-on-error`, the steps that need a browser wait for
    # `steps.chromium.outcome == 'success'`, the ones that do not (the site server, the upload, the run WITHOUT a browser) do not, and the LAST step fails the action when the install did not
    # succeed. A failed install used to end the action there: the shard ran nothing, uploaded nothing, and `mutation-await.mjs` waited for a result that would never come. Now the shard runs
    # with `--no-browser`: the expectations that need a browser are reported not applicable, every other mutation runs, the result is uploaded, and the action still ends red.
    # docs/CC-CMD-2026-11-11-runner-apt-mirror-dns.md, item 7.
    # No --with-deps (that is apt, and apt stalled ten minutes on 2026-11-11 when the Ubuntu mirrors did not resolve) and a time limit; docs/CC-CMD-2026-11-11-runner-apt-mirror-dns.md.
    # A composite action's step takes no timeout-minutes (GitHub lists none for them), so the limit is coreutils timeout: 180 s, SIGKILL 10 s later if the install
    # ignores SIGTERM, and any non-zero exit fails the step (here: marks it, `continue-on-error`, and the last step makes the action red).
    - name: Install Chromium
      id: chromium
      continue-on-error: true
      shell: bash
      run: timeout --kill-after=10 180 npx playwright install chromium

    - name: Serve the built site
      shell: bash
      run: |
        node scripts/serve.mjs &
        for i in $(seq 1 20); do
          curl -sf -o /dev/null http://localhost:8080/ && break
          sleep 1
        done

    # The result is written outside the working tree: the world mutations move files in and out of outbox/, and a result
    # file there would be a file the mutation under test could move.
    #
    # TWO STEPS, ONE PER STATE OF THE INSTALL, with the same two commands written twice (a bash array for the selection would hide the command from the guard, which reads `node <script> <args>`). Which one runs is decided by the
    # `if`, and scripts/check-browser-gate.py refuses a no-browser run whose `if` does not say `!= 'success'` and a browser run that does not say `== 'success'`.
    - name: Run the shard
      if: steps.chromium.outcome == 'success'
      shell: bash
      env:
        IDS: ${{ inputs.ids }}
      run: |
        if [ -n "$IDS" ]; then
          node scripts/mutation-check.mjs --ids "$IDS" \
            --build "${{ inputs.mode }}" \
            --out "$RUNNER_TEMP/mutation-shard-${{ inputs.index }}-of-${{ inputs.of }}.json"
        else
          node scripts/mutation-check.mjs --shard "${{ inputs.index }}/${{ inputs.of }}" \
            --build "${{ inputs.mode }}" \
            --out "$RUNNER_TEMP/mutation-shard-${{ inputs.index }}-of-${{ inputs.of }}.json"
        fi

    # THE INSTALL DID NOT SUCCEED: the same shard, told so. `--no-browser` makes the harness class an expectation that cannot launch a browser (Playwright's own text for it) as NOT
    # APPLICABLE, not as a failure, and every other mutation runs as always. The result says `noBrowser`, and scripts/mutation-merge.mjs reads it as a verdict problem, not a pass.
    - name: Run the shard without a browser
      if: steps.chromium.outcome != 'success'
      shell: bash
      env:
        IDS: ${{ inputs.ids }}
      run: |
        if [ -n "$IDS" ]; then
          node scripts/mutation-check.mjs --ids "$IDS" \
            --build "${{ inputs.mode }}" --no-browser \
            --out "$RUNNER_TEMP/mutation-shard-${{ inputs.index }}-of-${{ inputs.of }}.json"
        else
          node scripts/mutation-check.mjs --shard "${{ inputs.index }}/${{ inputs.of }}" \
            --build "${{ inputs.mode }}" --no-browser \
            --out "$RUNNER_TEMP/mutation-shard-${{ inputs.index }}-of-${{ inputs.of }}.json"
        fi

    # Even when the shard failed: a survivor is a result, and the reader has to be able to name it.
    - name: Upload the shard's result
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/mutation-shard-${{ inputs.index }}-of-${{ inputs.of }}.json
        if-no-files-found: error
        retention-days: 3
        # A re-run attempt of a shard publishes under the same name; without this the upload is refused (409) and the old attempt's artifact stays.
        overwrite: true

    # LAST, and `always()`: without it a failed install would leave the action GREEN with the browser-dependent mutations not run. The outcome comes in through `env:`;
    # scripts/check-browser-gate.py RUNS this script under `bash -e` for each outcome and requires a non-zero exit with an `::error::` line, which is why it may use only
    # echo, `exit N` and `[ ]` comparisons.
    - name: Install Chromium did not succeed, so the mutations that need a browser were not run
      if: always() && steps.chromium.outcome != 'success'
      shell: bash
      env:
        INSTALL_OUTCOME: ${{ steps.chromium.outcome }}
      run: |
        if [ "$INSTALL_OUTCOME" = skipped ]; then
          echo "::error::The Chromium install was skipped: an earlier step failed, or the run was cancelled before it. The mutations that need a browser were not run."
        elif [ "$INSTALL_OUTCOME" = cancelled ]; then
          echo "::error::The run was cancelled before the Chromium install finished. The mutations that need a browser were not run."
        else
          echo "::error::The Chromium install did not succeed (outcome: ${INSTALL_OUTCOME:-none, is the step id still chromium?}). The shard ran with --no-browser: the mutations that need a browser were NOT run, so this table is not a pass."
        fi
        exit 1
