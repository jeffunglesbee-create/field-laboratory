<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIELD Laboratory — desk scoreboard</title>
<!-- Suppresses the browser's automatic /favicon.ico request, which would
     otherwise be the only 404 in the render check. -->
<link rel="icon" href="data:,">
<!-- A preconnect to api.open-meteo.com was here from f7c0248 and is REMOVED.
     It was added on the reading that the first weather fan-out wave was paying
     DNS + TCP + TLS for the whole slate. Run 33078924162 measured that page and
     refuted it: with the preconnect live, the first wave still hung to its cap —
     `635+7999ms 635+8000ms 636+8000ms 636+8001ms` — and the connection was
     already warm. The hang is not connection setup. It is the intermittent
     reachability recorded in outbox/cc-the-runner-lost-open-meteo-2026-08-12.md,
     and what handles it is the retry in WeatherView.fetchSlate, measured on the
     same run recovering all four in 158-325ms. A tag kept for a reason that has
     been disproved is a comment that lies, so it goes. -->
<!--DESIGN-TOKENS-->
<style>
  :root {
    color-scheme: dark;
    /* The sport headings stick directly beneath the date bar, so the two
       offsets must agree exactly. Derived from one variable rather than
       eyeballed: a hand-tuned `top` that is 3px short of the bar's real height
       leaves a sliver of card content scrolling through the seam, which is
       precisely what the first attempt did. */
    --nav-h: 3.25rem;
    /* The tab bar sits above the date nav, so every sticky offset below is
       derived from BOTH heights rather than eyeballed. The 3px seam this
       repo already shipped once came from a hand-tuned `top`; adding a second
       sticky layer is exactly where that recurs. */
    --tab-h: 3rem;
    /* --bg and the rest of the palette are injected as #design-tokens, generated
       from Palette.fs / Typography.fs — the page's colours ARE the typed
       registry, never a hand-copied hex. */
  }
  body {
    font: 15px/1.5 var(--font-body);
    /* FLUID, not a flat 2rem. Measured 2026-08-29 at a 390px viewport: a fixed
       2rem put 64px of padding on a 390px screen -- 16.4% of it -- and that is
       desktop air inherited by a phone. It cost the brief prose about 4.5ch and
       left the measure at 41ch against a 45 floor.
       clamp keeps 2rem from 640px up, so nothing on desktop moves. */
    margin: 0; padding: clamp(1rem, 5vw, 2rem); background: var(--bg); color: var(--text);
  }
  h1 {
    font-family: var(--font-identity); font-weight: 700;
    font-size: 1.1rem; letter-spacing: .26em; text-transform: uppercase;
    opacity: .8; margin: 0 0 1.5rem; color: var(--text);
  }
  /* THE DIMMING MOVED FROM `opacity` TO `color`, and that is the whole fix.
     `opacity` on the container composites the entire subtree, so a child CANNOT
     raise itself back to full strength — a failure line styled `color: var(--red)`
     would still have rendered at 65%, looking like every other status. The
     container was the reason an error could not be made to look like an error.
     Per-line colour has no such ceiling. */
  .meta { font-size: .85rem; margin-bottom: 1.5rem; }
  .meta div { margin-bottom: .25rem; color: var(--dim-text); }
  /* Set by reportAs in Program.fs on EVERY write, so a line that recovers loses
     its marker instead of staying red for the rest of the session. */
  .meta [data-state="warn"]   { color: var(--caution); }
  .meta [data-state="failed"] { color: var(--red); }

  /* Tabs. Three surfaces over the same date: the slate, and the two picks —
     which are not the same feature and must not look like one. */
  .tabs {
    position: sticky; top: 0; z-index: 3;
    /* SCROLLS RATHER THAN OVERFLOWING THE PAGE.
       Measured 2026-08-29 at 360x780: seven tab buttons total 534px inside a
       324px container, and with `overflow-x: visible` they pushed the DOCUMENT
       to 576px. Every portrait phone scrolled horizontally -- 216px of overflow
       at 360, 185px at 393, 150px at 430 -- and it was the page, not the tabs.
       "FIELD — Viewport Consistency Specification" (Drive, May 24 2026, status
       DEFINITIVE) asserts for P1: "no element overflows viewport horizontally",
       and prescribes this exact treatment for the analogous filter bar:
       "horizontal scroll-snap, hidden scrollbar".
       Contained here so the row scrolls and the page does not. */
    overflow-x: auto; scroll-snap-type: x proximity;
    scrollbar-width: none; -ms-overflow-style: none;
    display: flex; gap: .25rem;
    height: var(--tab-h); box-sizing: border-box; align-items: stretch;
    margin: 0; background: var(--bg);
    border-bottom: 1px solid var(--edge-strong);
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    scroll-snap-align: start; flex: 0 0 auto;
    font: inherit; font-size: .8rem; letter-spacing: .04em;
    /* --dim-text, not --dim: 12.8px is well below WCAG's large-text line, so
       these need 4.5:1 and --dim measured 2.98:1 on the rendered page. */
    color: var(--dim-text); background: none;
    border: none; border-bottom: 2px solid transparent;
    padding: 0 .9rem; cursor: pointer;
  }
  /* HOVER IS GATED, PRESS IS NOT.
     A touch tap fires :hover and leaves it applied until the next tap
     elsewhere, so on a phone an untapped control keeps a hovered look. These
     three rules are colour-only, so the symptom is mild, but the desk is read
     on a phone and the gate costs nothing.
     :active is the state that was missing entirely: 102 interactive elements
     and not one declared a pressed look. The page has no transitions anywhere
     (measured 2026-08-29: zero `transition:`, zero @keyframes), so this lands
     instantly on press and releases instantly, which is what press feedback
     should do. No transform on .desk-card--flippable: a transform on a grid
     item creates a containing block, and the comment above that rule records
     a rotateY that "did not survive contact with a grid". The flip itself is
     that card's feedback.

     STALE CLAUSE, corrected 2026-09-01: "measured 2026-08-29: zero
     `transition:`, zero @keyframes" was true when written and is false three
     lines below, where the 100ms rule now sits. The measurement stands as
     history; the present tense did not. */
  @media (hover: hover) and (pointer: fine) {
    .tabs button:hover { color: var(--text); }
  }
  /* TOUCH FEEDBACK, to ITEM 4 of the June 12 Design System Items Catalog
     (Drive 1lWX2KtRPMNN1e8YfxrCd3aBPNzxOc8k0JAHOzUxprd0, DECISION: APPROVED):
     "All interactive elements: transform scale(0.98) + card-highlight
     background on :active. Duration 100ms ease-out."

     Three corrections to the first version of this rule, all from that item:

     1. The DURATION. This shipped with no transition at all, on my reasoning
        that "with no transitions anywhere it lands instantly on press and
        releases instantly, which is what press feedback should do". The spec
        says 100ms ease-out. It is the only transition on the page, and it is
        there because a decision record put it there.
     2. The BACKGROUND. Only the transform was implemented; the item pairs it
        with a card-highlight ground.
     3. GAME CARDS. I excluded .desk-card--flippable, reasoning that a transform
        on a grid item creates a containing block, citing a rotateY that "did
        not survive contact with a grid". The item lists "Game cards (all tiers)"
        first. Re-measured: scale(0.98) leaves the grid intact at all ten
        canonical viewports, zero overflow. A uniform scale is not a rotation,
        and the old scar did not transfer.

     NOT applied, per the same item's exclusion list: score elements, brief
     text, labels and headers. Those are data and prose, not controls. */
  .tabs button:active,
  .pk-sport:active,
  .pk-side:active,
  .desk-card--flippable:active,
  .datenav button:not([disabled]):active {
    transform: scale(0.98);
    transition: transform 100ms ease-out, background-color 100ms ease-out;
  }
  .desk-card--flippable:active,
  .pk-sport:active,
  .pk-side:active { background-color: var(--card2); }
  /* MOTION IS OPT-OUTABLE. The scale above is the page's only transform and its
     only transition, added from the June 12 catalog. WCAG 2.3.3 covers motion
     from interaction, and a 2% scale is exactly that — small, but the guard
     costs one query and the alternative is a control that moves for a reader
     who asked the OS for none.

     The background-colour half is DELIBERATELY KEPT: a colour change is not
     motion, and removing it would leave those four controls with no pressed
     state at all for the one reader who most needs the feedback unambiguous. */
  @media (prefers-reduced-motion: reduce) {
    .tabs button:active,
    .pk-sport:active,
    .pk-side:active,
    .desk-card--flippable:active,
    .datenav button:not([disabled]):active {
      transform: none;
      transition: background-color 100ms ease-out;
    }
  }
  /* TAP LATENCY, not gesture routing. iOS reserves ~300ms after a tap on any
     element that could be a double-tap-to-zoom target, and every control on
     this page is one. `manipulation` allows panning and pinch-zoom and drops
     only double-tap zoom, so scrolling is untouched and the page stops feeling
     a third of a second behind the finger.

     NOT on `.tabs` itself. That is a scroll-snap horizontal scroller, and its
     default `auto` is already correct: the browser routes a horizontal drag to
     the scroller and a vertical one to the page. `pan-x` there would block
     vertical page scroll for any gesture starting on the tab bar, which is a
     regression dressed as a fix. */
  .tabs button,
  .datenav button,
  .pk-sport,
  .pk-side,
  .desk-card--flippable {
    touch-action: manipulation;
    /* The other half of the same interaction. `manipulation` drops the
       double-tap ZOOM; this drops the double-tap SELECTION, where the second
       tap highlights the button's own label instead of firing it. Labels here
       are control text — "Today", "LIVE" — never content anyone copies. */
    -webkit-user-select: none; user-select: none;
  }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--discovery); }
  /* Focus must stay visible: a tablist is keyboard-driven by design, and the
     arrow-key pattern is unusable if focus is invisible. */
  .tabs button:focus-visible { outline: 2px solid var(--discovery); outline-offset: -2px; }
  [role="tabpanel"][hidden] { display: none; }

  .pick-panel { max-width: 46rem; }
  .pick-panel h2 { font-size: .95rem; margin: 0 0 .35rem; }
  .pick-panel__what { font-size: .82rem; opacity: .65; margin: 0 0 1.25rem; }
  /* No accent rail. `border-left: 3px solid var(--discovery)` with
     `border-radius: 10px` is the rounded-corner-with-a-coloured-bar shape the
     unslop-ui checklist names by hand, and the rail was decoration: this is the
     only boxed item in the panel — the chasers below it are bare rows with a
     bottom rule — so the card boundary already says which one is the leader,
     and .pick-leader__matchup is 1.05rem against their .86rem. Now it carries
     the same boundary as every other card in this file. */
  /* NO BOX. It carried the invisible `--edge` until 2026-08-26, and when that
     token was deleted the choice was a VISIBLE box or none. A visible one was
     tried and rejected on the rendered page: an outlined rounded card with three
     outlined pills inside it is card-in-card, and the panel already names its own
     hierarchy in words — "Field's Pick" above, "Also ranked" below. Rule 7:
     hierarchy comes from type, not containers. The matchup line is 1.05rem
     against the chasers' .86rem and that is the whole of what distinguishes it. */
  .pick-leader {
    padding: .9rem 0; margin-bottom: 1rem;
  }
  .pick-leader__matchup { font-size: 1.05rem; margin-bottom: .3rem; }
  .pick-leader__tie { font-size: .8rem; color: var(--caution); margin-bottom: .5rem; }
  .pick-reasons { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
  .pick-reason {
    font-size: .74rem; padding: .2rem .5rem; border-radius: 999px;
    background: var(--card2); border: 1px solid var(--edge-strong); color: var(--text);
  }
  .pick-brief { font-size: .88rem; margin-top: .6rem; opacity: .85; }
  /* NO ROW SEPARATORS ANYWHERE BELOW. `.pick-chaser`, `.gate`, `.pk-row` and
     `.briefs-stat` each carried `border-bottom: 1px solid var(--edge)`, which
     renders at 1.08:1 — measured, not estimated. What actually separates the
     rows is their own padding, and that was measured too, on the rendered page:

       .pick-chaser  16.0px      .pk-row       19.2px
       .gate         16.0px      .briefs-stat  22.4px   (context-briefs-fixture)

     Every one of those is above the 4px bar `separation-check` already accepts
     as sufficient for the scoreboard cards. Same mechanism, same measurement,
     same conclusion: the whitespace carries it and the hairline carried nothing. */
  .pick-chaser {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: .5rem 0; font-size: .86rem;
  }
  .pick-chaser__reasons { font-size: .74rem; opacity: .6; text-align: right; }
  .gate { padding: .5rem 0; font-size: .84rem; }
  .gate__name { color: var(--text); }
  .gate__answer { font-size: .78rem; opacity: .7; }
  .gate--qualifies .gate__name { color: var(--discovery); }
  .gate--unanswerable .gate__name { color: var(--caution); }
  .pick-empty { font-size: .88rem; opacity: .7; }

  /* Drama sparkline. 30 bars on a fixed 0-100 domain, so a bar's height in
     percent IS the drama value — no scale factor, and no series maximum
     anywhere in the CSS or the F#. */
  .spark { margin-top: .6rem; }
  .spark__row {
    /* 44px, the GLYPH minimum. The production version used 24px, at which a
       30-point spread is about seven pixels and every card looks the same. */
    height: 44px;
    display: flex; align-items: flex-end; gap: 1px;
  }
  .spark__bar {
    flex: 1 1 0; min-width: 0;
    background: var(--must);
    border-radius: 1px 1px 0 0;
  }
  .spark__caption {
    font-size: .7rem; opacity: .55; margin-top: .3rem;
    font-variant-numeric: tabular-nums;
  }

  /* Pick'em. */
  /* No box, for the same reason as `.pick-leader`. A one-line status statement
     does not need an outline to be read as a one-line status statement. */
  .pk-banner {
    padding: .8rem 0; margin-bottom: 1rem;
    font-size: .92rem;
  }
  .pk-sports { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .5rem; }
  .pk-sport {
    font: inherit; font-size: .78rem;
    display: inline-flex; align-items: center; gap: .4rem;
    color: var(--dim); background: var(--card2);
    border: 1px solid var(--edge-strong); border-radius: 8px;
    padding: .3rem .6rem; cursor: pointer;
    /* 44px floor, same as the date nav. Measured 30px tall before. */
    min-height: 44px;
  }
  /* The selected state must actually differ. This set `background: var(--card2)`
     and `border-color: var(--edge)` — the exact values .pk-sport already
     declares — so a filter that was ON was distinguished by nothing but
     dim -> text, while the CSS read as though three properties changed. The
     accent border is the vocabulary .pk-side--chosen already uses for the same
     idea. */
  .pk-sport--on { color: var(--text); border-color: var(--must); }
  .pk-sport:focus-visible { outline: 2px solid var(--discovery); outline-offset: -2px; }
  .pk-sport__count { opacity: .6; font-variant-numeric: tabular-nums; }
  .pk-legend { font-size: .74rem; opacity: .5; margin: 0 0 1rem; }

  /* Fixed tracks, not flex. On the production screen a row with two long team
     names ("Rockies @ Diamondbacks") pushed its status chip onto a second line
     while every other row kept it inline — the chip was what gave way when the
     names overflowed. A grid gives the chip its own column, so the longest
     fixture on the slate cannot break the row it appears in. The matchup cell
     is the one allowed to shrink, and it truncates instead. */
  .pk-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 5.5rem;
    align-items: center; gap: .75rem;
    padding: .6rem 0;
  }
  .pk-row__matchup { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pk-row__sides { display: flex; gap: .4rem; }
  .pk-side {
    font: inherit; font-size: .82rem;
    color: var(--dim); background: var(--card2);
    border: 1px solid var(--edge-strong); border-radius: 8px;
    padding: .35rem .7rem; cursor: pointer; white-space: nowrap;
    /* 44px floor. Measured 33px tall before -- and these are the pick'em
       controls, the most-tapped things on the page after the tabs. */
    min-height: 44px;
  }
  @media (hover: hover) and (pointer: fine) {
    .pk-side:hover { color: var(--text); }
  }
  .pk-side--chosen { color: var(--discovery); border-color: var(--must); }
  .pk-side:focus-visible { outline: 2px solid var(--discovery); outline-offset: -2px; }
  /* An event has no sides to pick between. Deliberately NOT styled as a
     disabled button: a greyed-out control still draws the contest this case
     exists to deny, and the field-playground probe recorded exactly that
     failure mode -- both pick buttons greyed with no explanation. */
  .pk-side--none { font-size: .78rem; color: var(--dim); font-style: italic; white-space: nowrap; }
  .pk-chip {
    font-size: .68rem; letter-spacing: .06em; text-align: center;
    padding: .25rem .4rem; border-radius: 6px; white-space: nowrap;
  }
  .pk-chip--none    { color: var(--quiet); background: var(--card2); }
  .pk-chip--pending { color: var(--caution); background: var(--card2); }
  .pk-chip--live    { color: var(--watch); background: var(--card2); }
  .pk-chip--drawn   { color: var(--quiet); background: var(--card2); }
  .pk-chip--right   { color: var(--discovery); background: var(--card2); }
  .pk-chip--wrong   { color: var(--red); background: var(--card2); }

  /* Narrow screens: let the row become two lines DELIBERATELY, all rows at
     once, rather than only the row that happens to have long names. */
  @media (max-width: 34rem) {
    .pk-row { grid-template-columns: minmax(0, 1fr) 5.5rem; }
    .pk-row__sides { grid-column: 1 / -1; }
  }



  /* Date navigation. Sticky because a full multi-sport slate is long and the
     controls are useless if you have to scroll back to the top to reach them. */
  .datenav {
    position: sticky; top: var(--tab-h); z-index: 2;
    display: flex; align-items: center; gap: .6rem;
    height: var(--nav-h); box-sizing: border-box;
    margin: 0 0 1.5rem;
    background: var(--bg);
    border-bottom: 1px solid var(--edge-strong);
  }
  .datenav button {
    font: inherit; font-size: .8rem;
    color: var(--text); background: var(--card);
    border: 1px solid var(--edge-strong); border-radius: 8px;
    padding: .35rem .7rem; cursor: pointer;
    /* 44px, the Apple HIG floor. Measured 2026-08-29 at P2 (393x852): these
       three rendered 32px tall and 35px wide -- the only tap targets on the
       page below the floor, out of 33.
       "Viewport v4 CSS Audit" (Drive, June 14 2026) flags the same selector in
       the sibling product under item #7: "Apple HIG floor breached for primary
       tap targets", naming .date-nav-btn among them. Same control, same miss,
       found here by measuring rather than by reading that audit -- but the
       audit is why it was measured.
       min-width too: a 35px-wide arrow is as hard to hit as a short one. */
    min-height: 44px; min-width: 44px;
    display: inline-flex; align-items: center; justify-content: center;
  }
  @media (hover: hover) and (pointer: fine) {
    .datenav button:hover:not([disabled]) { background: var(--card2); }
  }
  /* Pinning to a committed capture disables navigation — the capture is one
     fixed day, so stepping off it would silently show a different date's data
     under a URL that claims to be pinned. Disabled controls say so visually. */
  .datenav button[disabled] { opacity: .35; cursor: not-allowed; }
  /* The ONLY control on the page without this, found by counting: four
     selectors carried the discovery outline and the date nav — the primary
     navigation — fell through to the user-agent default. That default is
     visible on this ground rather than absent, so this is a consistency fix,
     not a rescue: one focus ring, not two. */
  .datenav button:focus-visible { outline: 2px solid var(--discovery); outline-offset: -2px; }
  #viewed-date {
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
    font-size: .9rem; opacity: .8; min-width: 10ch;
  }

  /* The slate stacks sport sections vertically; the grid now lives on each
     section's own grid, not on #desk, or the section headings would be laid
     out as grid cells alongside the cards. */
  #desk { display: block; }
  .sport-group { margin: 0 0 2rem; }
  /* Sticky so the sport stays identifiable while scrolling a long section.
     Opaque background and a full-bleed rule are load-bearing, not decoration:
     a sticky heading floats OVER the cards, so a transparent or partial
     background lets card text render through it. */
  .sport-group__title {
    position: sticky; top: calc(var(--tab-h) + var(--nav-h)); z-index: 1;
    font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
    /* --dim-text, not --dim: 12.48px text needs 4.5:1; --dim gave 2.98:1. */
    font-weight: 600; color: var(--dim-text); margin: 0 0 .75rem;
    padding: .55rem 0; background: var(--bg);
    box-shadow: 0 -1px 0 var(--bg), 0 1px 0 var(--edge-strong);
  }
  /* THE GRID FLOOR IS 400px, CLAMPED TO THE CONTAINER.
     Raised from 260px on 2026-08-30, deliberately, as a trade rather than a
     bug fix: the brief is prose and a 260px floor gave it 24.4ch on a 1440px
     monitor, against taste.md's 45-75ch band. The desk read worst on the
     machine built to read it, because `auto-fill` packs MORE columns as the
     viewport grows.

       viewport   cols 260 -> 400   briefCh 260 -> 400
       P1 360       1 -> 1          31   -> 31
       P2 393       1 -> 1          34.2 -> 34.2
       P3 430       1 -> 1          37.8 -> 37.8
       L1 667       2 -> 1          27.7 -> 61
       T 834        2 -> 1          36.7 -> 64.9
       D1 1200      4 -> 2          25.4 -> 56.4
       D3 1440      5 -> 3          24.4 -> 44.3
       U1 1920      6 -> 4          28   -> 44.8

     `min(400px, 100%)` AND NOT A BARE 400px. A bare floor is a MINIMUM: when
     no 400px track fits, auto-fill still lays one down and the document grows
     past the viewport. Measured, not reasoned: 58px of horizontal overflow at
     360 and 27px at 393 — the two commonest phone widths — against a spec whose
     P1 line reads "Assert: no element overflows viewport horizontally"
     (Drive 1jvQw0uS3TR..., May 24 2026, DEFINITIVE). `min()` clamps the floor
     to the container, so the phone rows above are byte-identical either way and
     only the wider viewports move.

     WHAT IT COSTS, stated because it is a trade: every viewport loses columns.
     Desktop goes 5 to 3 as predicted, and 834 and 667 drop to a SINGLE column,
     which was not predicted — a tablet now shows one card per row.

     AND IT DOES NOT FIX 1440 OR 1920. Both land at 44.3 and 44.8ch, just under
     the band's 45 floor, because auto-fill spends the extra width on a third
     and fourth column rather than on measure. Closing that last half-character
     means capping the grid's own width, which is a different decision about how
     much of the screen the desk should use, and is not being made here. */
  .sport-group__grid {
    display: grid; gap: 1rem;
    grid-template-columns: repeat(auto-fill, minmax(min(400px, 100%), 1fr));
  }


  /* SHORT VIEWPORTS DROP THE THIRD STICKY LAYER.
     Measured 2026-09-01 across the ten canonical viewports: the sticky stack is
     a flat 154-168px everywhere, which is 15-21% of a portrait phone and
     44.9% of L1 (667x375, iPhone SE landscape) — 168px of chrome above 207px
     of content, about one card.

     `viewport-overflow-check` proved nothing spills sideways while a third of
     the screen was going vertically, because it only ever measured one axis.

     The sport heading is the layer that goes. Its job is keeping the sport
     identifiable while scrolling a long section, and a viewport this short
     holds barely one card — there is no long section to lose your place in.
     The tab bar and the date nav stay: those are controls, and the comment on
     `.datenav` records why they are sticky at all.

     Height, not width: a tall narrow phone has the room and keeps all three.

     PLACED AFTER the rule it overrides, not with the other media queries. A
     media query adds NO specificity, so the same selector declared later still
     wins — the first attempt sat 90 lines above `.sport-group__title` and
     changed nothing at all. Measured, not read: the title was still `sticky`
     at 667x375 and the content share had not moved off 55.1%. */
  @media (max-height: 500px) {
    .sport-group__title { position: static; }
  }  /* NO BORDER, AND NO RADIUS. Measured 2026-08-26: `--edge` renders at 1.09:1
     against `--card`, and holding layout constant (`var(--edge)` ->
     `transparent`, same box, no reflow) the outline's entire visual contribution
     was 5766 of 1152000 pixels at a max channel delta of 15 of 255 — half a
     percent of the page at under 6% of one channel.
     The 1rem grid gap and the per-card `aria-label`led `<section>` carry the
     grouping, and `separation-check` asserts both. The radius went with the
     border: with no border, no overflow clip and a 1.03:1 fill, a 10px corner
     had nothing to round. */
  .desk-card {
    padding: 1rem 1.1rem; background: var(--card);
  }
  .desk-card__header { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; opacity: .5; }
  .desk-card__teams { font-weight: 600; margin: .4rem 0 .1rem; }
  /* `font-weight: 700` was a literal here. It is now the AXIS DEFAULT, set
     through font-variation-settings so that the one declaration the score's
     weight travels on is the one a driver would later write — rather than a
     driver's `font-variation-settings` silently losing to a `font-weight`
     further down the cascade. 700 is `Typography.styleOf Score`'s weight; a
     check holds the two to each other. */
  .desk-card__score {
    font-size: 2rem; font-variant-numeric: tabular-nums;
    font-variation-settings: 'wght' 700;
  }
  .desk-card__status { font-size: .8rem; opacity: .75; }
  .desk-card__drama, .desk-card__odds, .desk-card__winprob { font-size: .75rem; opacity: .55; margin-top: .3rem; }
  .desk-card__winprob { font-variant-numeric: tabular-nums; }
  .desk-card__wx { font-size: .75rem; opacity: .7; margin-top: .3rem; }

  /* --- The brief flip -----------------------------------------------------
     A card with a joined brief turns to reveal the prose. Only flippable cards
     get any of this; a plain card is untouched and keeps its old box exactly.

     THIS CSS WAS WRONG TWICE. Stage 1 put it in public/index.html — gitignored
     build output that build-site.mjs overwrites from THIS file — so it never
     shipped. Stage 2 moved it here but used a grid-stack with
     transform-style: preserve-3d, and a real browser FLATTENS preserve-3d on a
     grid container: both faces rendered at once, so every card dumped the brief
     and its footnotes onto the front. A computed-style check that preserve-3d
     was SET passed while the rendered flip did nothing — the property was there,
     its effect was not. The guard now asserts the back face is actually hidden
     when collapsed, which is the thing that was broken.

     So this is a disclosure, not a 3D flip: the back face is display:none until
     the card is toggled, then it swaps for the front. It sizes to content (no
     clipping), works in every engine, and hides the footnotes until you ask for
     them — which is the actual requirement. `aria-expanded` was always the real
     semantics; the rotateY was a flourish that did not survive contact with a
     grid. */
  .desk-card--flippable { cursor: pointer; }
  .desk-card--flippable:focus-visible { outline: 2px solid var(--discovery); outline-offset: 2px; }
  /* THE CAP IS ON THE TEXT, NOT THE CARD.
     `span 2` fixed desktop (24.4 -> 54.4ch) and overshot tablet: at 834px the
     grid is TWO columns, so spanning two makes the card full width and the
     brief ran 79ch, past the 75 ceiling. Widening a card and capping its prose
     are different jobs, and this is the one the rule is actually about.
     65ch, and the number is FIELD's own rather than the skill's. The first
     version used 68, reasoned from taste.md's 45-75 band ("the ceiling is where
     it stops being comfortable, not a target to sit on"). "FIELD — Complete
     Feature x Viewport Audit" (Drive, May 24 2026, DEFINITIVE) already fixes it
     in Section 3: "P4 lock: CENTRE reading width max 65ch". A project with its
     own locked reading width does not need one derived from a third-party rule
     of thumb, and 68 quietly overran it. */
  .desk-card__brief-text { max-width: 65ch; }
  .desk-card__brief { display: none; }
  /* NO `span 2` ON A FLIPPED CARD. Removed 2026-08-30: reported as "double
     wide, renders weird", and A/B measured before removing.

       viewport      cols   briefCh          cardW           cards moved
       P1 phone        1    31 -> 31       324 -> 324        62 -> 62
       T tablet        2    64.9 -> 36.7   770 -> 377        63 -> 62
       D3 desktop      5    54.3 -> 24.4   541 -> 262         2 -> 58

     THE DEFECT IS THE TABLET ROW. At two columns, spanning two is the whole
     grid: a 770px card among 377px siblings is not a wider card, it is a
     full-bleed panel, and it stops reading as a member of the grid it is in.
     Desktop's 541px among 262px siblings is the milder version of the same
     thing -- one card visibly unlike every other, which is what "double wide"
     names.

     I FIRST WROTE THAT IT REFLOWED THE SLATE. It does not. The measurement says
     the opposite on desktop: 2 cards moved WITH the rule and 58 without, because
     a card wide enough to absorb the brief's height keeps it inside one row.
     Flipping reflows either way -- the front face swaps for the brief and the
     height changes -- so reflow never discriminated between the two versions,
     and the argument was reasoning, not evidence.

     SO THE REMOVAL HAS A REAL COST, stated rather than buried: the brief loses
     28ch on tablet and 30ch on desktop, landing at 24.4ch against taste.md's
     45-75ch band, and desktop reflow goes from 2 cards to 58. Desktop is worst
     because the grid floor was then 260px and `auto-fill` packs more columns as the
     viewport grows -- the desk reads worst on the machine built to read it.
     `.desk-card__brief-text`'s 65ch cap is a ceiling and a 262px column never
     approaches it.
     THE REMAINING LEVER WAS PULLED, later the same day: the grid floor went
     from 260px to `min(400px, 100%)`, which takes the brief to 64.9ch on tablet
     and 56.4ch at 1200 without widening any single card relative to its
     siblings. See the `.sport-group__grid` comment above for the full table and
     what it costs in columns. `span 2` remains the wrong tool: it fixed measure
     by making ONE card unlike the others, and the floor fixes it by changing
     every card equally. Do not re-add `span 2` without looking at a tablet. */
  .desk-card.is-flipped .desk-card__front { display: none; }
  .desk-card.is-flipped .desk-card__brief { display: block; }
  .desk-card__flip-hint {
    font-size: .7rem; letter-spacing: .04em; text-transform: uppercase;
    opacity: .5; margin-top: .5rem;
  }
  .desk-card__brief-kind {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .06em;
    opacity: .5; margin-bottom: .4rem;
  }
  .desk-card__brief-text { margin: 0; font-size: .85rem; line-height: 1.45; }

  /* Stage 2: the scoreline verdict. Same colour vocabulary the pick'em chips
     use — green confirmed, red wrong, amber cannot-tell-yet. */
  .desk-card__verdict {
    margin-top: .6rem; font-size: .72rem; letter-spacing: .04em;
    padding: .2rem .5rem; border-radius: 6px; display: inline-block;
  }
  .desk-card__verdict--ok   { color: var(--discovery); background: var(--card2); }
  .desk-card__verdict--bad  { color: var(--red); background: var(--card2); }
  .desk-card__verdict--wait { color: var(--caution); background: var(--card2); }

  /* Stage 3: provenance and anchoring. Quiet metadata under the prose — the
     brief is the content, these are footnotes about where it came from and how
     well it anchors its numbers in time. */
  .desk-card__brief-prov, .desk-card__brief-fallback, .desk-card__brief-anchor {
    font-size: .7rem; opacity: .55; margin-top: .35rem; line-height: 1.35;
  }
  .desk-card__brief-prov { margin-top: .6rem; opacity: .65; }

  /* Stage 4: the Briefs tab. One aggregate statement per row — a big number and
     the finding it restates. */
  .briefs-panel { max-width: 46rem; }
  .briefs-panel__title { font-size: .95rem; margin: 0 0 1rem; }
  .briefs-panel__empty { font-size: .88rem; opacity: .7; }
  .briefs-stat {
    display: grid; grid-template-columns: 5.5rem 1fr; gap: 1rem; align-items: baseline;
    padding: .7rem 0;
  }
  .briefs-stat__value {
    font-size: 1.3rem; font-weight: 700; font-variant-numeric: tabular-nums;
    color: var(--text); text-align: right;
  }
  .briefs-stat__label { font-size: .82rem; opacity: .7; line-height: 1.4; }

  /* --- Stats and Weather panels ------------------------------------------
     These shipped with NO styling at all, so every game ran together as one
     column of text — the scoreboard had `.desk-card` and the two new panels
     had nothing. Both now use the same boundary the scoreboard already
     established: a border, a radius, a background one step off the page, and
     a real gap between siblings.

     The gap is what `separation-check.mjs` measures. A border alone does not
     separate anything if the boxes are flush. */
  .st-reports, .wx-rows {
    display: grid;
    gap: 1rem;
  }
  /* Same removal as `.desk-card`, same measurement, same two mechanisms left
     doing the work: a 1rem gap in `.st-reports` / `.wx-rows`, and a landmark
     region per card. */
  .st-card, .wx-row {
    padding: 1rem 1.1rem;
    background: var(--card);
  }
  .st-card__header {
    font-weight: 600; font-size: 1rem; margin-bottom: .15rem;
  }
  .st-card__title {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; opacity: .45;
    margin-bottom: .6rem;
  }
  .st-rows { display: grid; gap: .3rem; }
  .st-row { display: grid; grid-template-columns: 7.5rem 1fr auto; gap: .6rem; align-items: baseline; }
  .st-row__label { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; opacity: .45; }
  .st-row__value { font-size: .85rem; }
  /* `.st-row--gap` and `.st-row__flag` lived here and were removed 2026-08-26:
     nothing in src/ has ever emitted either, and nothing rendered them on any
     panel.

     CORRECTED the same night. The first version of this comment said the intent
     was "real and NOT lost" and called it a pending StatsView.fs change. That
     was an inherited claim, taken from the CSS comment these rules carried and
     never checked against the F# (Rule 72). StatsView.fs's own header supersedes
     it:

       NOTHING IS UNRESOLVED. Production drops the PARK row entirely when the
       lookup returns null ... The first version here marked such rows
       "unresolved", which was better and still wrong: a report that asserts five
       rows and can fill one is a report about the wrong subject. Every row is
       now built from a field this payload carries, and `Row` has no unresolved
       case to build.

     `Row` is a four-case DU — ParkRow, UmpireRow, PitcherRow, RecordsRow — with
     no unresolved case. The state is unrepresentable, which is a stronger answer
     than marking it. These rules were not waiting for a feature; they outlived a
     design that was deliberately replaced. */
  .st-card__comeback { margin-top: .15rem; font-size: .8rem; opacity: .75; }
  .st-panel__what, .wx-panel__what { font-size: .8rem; opacity: .6; max-width: 60ch; }

  .wx-row { display: grid; grid-template-columns: 1fr auto; gap: .3rem 1rem; }
  .wx-row__venue { font-weight: 600; font-size: .9rem; }
  .wx-row__conditions { font-size: .85rem; text-align: right; }
  .wx-row__roof { grid-column: 1 / -1; font-size: .7rem; opacity: .5; }
  .wx-verdict { font-size: .85rem; margin: .6rem 0 1rem; }
  .wx-error { color: var(--caution); }
  .wx-partial, .wx-unlocated, .wx-error__why { font-size: .7rem; opacity: .5; margin-top: .8rem; }


  /* The Lineups panel. A starting XI, and the mark that says what kind it is.

     THE MARK IS A COLUMN, NOT A BADGE. Every player row is three tracks —
     shirt-and-position, name, and the row's own word — so the word appears
     twenty-two times on a sheet rather than once on the card. That is the
     commissioning document's Task 2 in CSS: "make it a property of the row
     rather than a legend elsewhere on the page." A row cropped out of a
     screenshot, or read aloud on its own, keeps it.

     The colour comes from Palette.fs through an inline style on each mark cell,
     not from a class here, for the reason the token comment at :root gives: the
     page's colours ARE the typed registry. `markSemantic` maps Unannounced to
     Semantic.Caution, which is the amber this palette already assigns to
     "bracket trap / injury". The WORD is the primary channel and the colour is
     the redundant one — a reader who cannot distinguish amber reads the same
     text.

     NO GRID FOR A NON-ANSWER. `.lu-sides` is emitted only for the three answers
     that carry players, so the five that do not cannot render as a thin team
     sheet. There is deliberately no `.lu-sides--empty`. */
  .lu-panel { max-width: 100%; }
  .lu-headline { font-size: .9rem; max-width: 70ch; margin: .2rem 0 .8rem; }
  .lu-detail { font-size: .72rem; color: var(--dim-text); max-width: 70ch; margin: -.4rem 0 .8rem; }
  .lu-disagree { margin: 0 0 1rem; padding: .6rem .7rem; background: var(--card2); }
  .lu-disagree__label {
    font-size: .64rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--caution); margin-bottom: .3rem;
  }
  .lu-disagree__note { font-size: .78rem; }
  .lu-sides { display: grid; gap: 1.25rem; }
  .lu-side { background: var(--card); padding: .9rem 1rem; }
  .lu-side__head { display: flex; gap: .6rem; align-items: baseline; margin-bottom: .6rem; }
  .lu-side__team { font-weight: 600; font-size: 1rem; }
  .lu-side__formation {
    font-size: .7rem; letter-spacing: .06em; color: var(--dim-text);
    font-family: var(--font-identity);
  }
  .lu-rows { display: grid; gap: .25rem; }
  .lu-rows--subs { margin-top: .2rem; opacity: .72; }
  .lu-row { display: grid; grid-template-columns: 4.5rem 1fr auto; gap: .6rem; align-items: baseline; }
  .lu-row__slot {
    font-size: .7rem; color: var(--dim-text); font-family: var(--font-identity);
    font-variant-numeric: tabular-nums;
  }
  .lu-row__name { font-size: .85rem; }
  /* No colour here. The inline style from Palette.fs sets it per mark, and a
     colour in this rule would be a second source for one value. */
  .lu-row__mark {
    font-size: .62rem; text-transform: uppercase; letter-spacing: .07em;
    white-space: nowrap;
  }
  .lu-subs__label {
    font-size: .62rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim-text); margin-top: .7rem;
  }
  .lu-unavails { display: grid; gap: 1rem; margin-top: 1.25rem; }
  .lu-unavail__label {
    font-size: .62rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--caution); margin-bottom: .35rem;
  }
  .lu-unavail__rows { display: grid; gap: .25rem; }
  .lu-unavail__row { display: grid; grid-template-columns: 1fr auto; gap: .6rem; align-items: baseline; }
  .lu-unavail__who { font-size: .82rem; }
  .lu-unavail__why { font-size: .7rem; color: var(--dim-text); text-align: right; }
  .lu-updated { font-size: .68rem; color: var(--dim-text); margin-top: 1.25rem; }
  @media (min-width: 46rem) {
    .lu-sides { grid-template-columns: 1fr 1fr; }
    .lu-unavails { grid-template-columns: 1fr 1fr; }
  }

  /* The Draw panel. A knockout bracket with the canonical-size law's verdict
     printed beside every round.

     THREE STATES, THREE TREATMENTS, and that is the whole design constraint.
     A round can be compared and match, compared and be short, or NOT COMPARED —
     the entry round because byes decide its size, the innermost round of an
     unfinished draw because the calendar does. For two months "not compared"
     rendered identically to "compared and fine", and nine of ten Masters draws
     were reported corrupt on the strength of it. So the exempt state gets its
     own colour rather than borrowing the quiet one: --violet is neither the
     dim of a pass nor the red of a defect, which is exactly what it means. */
  .dv-panel { max-width: 100%; }
  .dv-head { margin-bottom: 1.25rem; }
  .dv-head__title { margin: 0; font-size: 1rem; }
  .dv-head__season { margin: .1rem 0 .8rem; font-size: .8rem; color: var(--dim-text); }
  .dv-head__facts,
  .dv-head__champion,
  .dv-head__law,
  .dv-head__nowhere {
    margin: .25rem 0; font-size: .8rem; color: var(--dim-text); max-width: 78ch;
  }
  .dv-head__champion { color: var(--text); }
  .dv-head__law[data-off-canonical="0"] { color: var(--dim-text); }
  .dv-head__nowhere[data-from-nowhere="0"] { color: var(--dim-text); }
  .dv-head__refused { margin: .25rem 0; font-size: .8rem; color: var(--caution); max-width: 78ch; }
  .dv-match__refused {
    margin: 0 0 .15rem; font-size: .62rem; letter-spacing: .04em;
    text-transform: uppercase; color: var(--caution);
  }
  .dv-match[data-scoreline="refused"] { border-color: var(--caution); }
  .dv-idle { font-size: .85rem; color: var(--dim-text); }
  .dv-error { font-size: .85rem; color: var(--red); max-width: 70ch; }

  /* Scrolls INSIDE the panel. A 128 draw is seven columns wide and the page
     must not be what scrolls sideways — the viewport-overflow check asserts
     that, and the tab strip above already had to be fixed for the same reason. */
  .dv-tree {
    display: flex; align-items: flex-start; gap: 1.25rem;
    overflow-x: auto; padding-bottom: .75rem;
  }
  /* TOP-ALIGNED, not centred. The entry round holds 64 matches and the final
     holds one; vertical centring would put the final 2,700px down the page,
     level with nothing, and every inner round would need scrolling past to
     reach. The client's bracket was changed to this for the same reason. */
  .dv-round { flex: 0 0 15rem; }
  .dv-round__head { position: sticky; top: calc(var(--tab-h) + var(--nav-h)); background: var(--bg); padding: .35rem 0 .5rem; z-index: 1; }
  .dv-round__name {
    margin: 0; font-family: var(--font-identity); font-size: .72rem;
    text-transform: uppercase; letter-spacing: .1em; color: var(--text);
  }
  .dv-round__note { margin: .15rem 0 0; font-size: .68rem; font-variant-numeric: tabular-nums; }
  .dv-round__note--held { color: var(--dim-text); }
  .dv-round__note--off { color: var(--red); }
  .dv-round__note--exempt { color: var(--violet); }
  .dv-round__matches { display: grid; gap: .4rem; }

  .dv-match {
    background: var(--card); border: 1px solid var(--dim);
    border-radius: 3px; padding: .35rem .5rem;
  }
  /* The mark goes on the MATCH and reads on the player's own row, so a bracket
     of 127 matches does not need a legend to be read. */
  .dv-match[data-from-nowhere="true"] { border-left: 2px solid var(--violet); }
  .dv-side {
    display: grid; grid-template-columns: 1fr auto auto; gap: .4rem;
    align-items: baseline; color: var(--dim-text); font-size: .8rem;
  }
  .dv-side--won { color: var(--text); font-weight: 600; }
  .dv-side__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dv-side__name--none { color: var(--dim); }
  .dv-side__cc { font-size: .62rem; letter-spacing: .06em; color: var(--dim); }
  .dv-side__score { font-family: var(--font-identity); font-variant-numeric: tabular-nums; font-size: .72rem; }


  /* The Verify panel. 146 checks, each with the input that must fail.

     THE SAME THREE-STATE PROBLEM the Draw panel has, one level up. `held`,
     `broke` and `no teeth` are not a pass, a fail, and a worse fail: NO TEETH
     means the check ran and proved nothing, which is a different thing to
     learn than either. It gets --violet for the same reason the draw's
     "not compared" does — neither the dim of a pass nor the red of a defect. */
  .sv-panel { max-width: 100%; }
  .sv-head { margin-bottom: 1.5rem; }
  .sv-head__title { margin: 0 0 .4rem; font-size: 1rem; }
  .sv-head__what,
  .sv-head__score,
  .sv-head__timing { margin: .3rem 0; font-size: .8rem; max-width: 78ch; color: var(--dim-text); }
  .sv-head__score--passed { color: var(--text); }
  .sv-head__score--blocked { color: var(--red); }
  .sv-idle { font-size: .85rem; color: var(--dim-text); }
  .sv-error { font-size: .85rem; color: var(--red); max-width: 78ch; }

  /* The verdict word carries the state in weight and colour. Not a pill on a
     tinted rounded rectangle: three of those side by side read as one control
     group, and these are three different findings. */
  .sv-verdict {
    font-family: var(--font-identity); font-size: .62rem;
    text-transform: uppercase; letter-spacing: .12em;
    min-width: 5.5rem; flex: 0 0 auto;
  }
  .sv-verdict--held { color: var(--dim-text); }
  .sv-verdict--broke { color: var(--red); font-weight: 700; }
  .sv-verdict--noteeth { color: var(--violet); font-weight: 700; }

  .sv-selftest {
    margin: 1rem 0 1.25rem; padding: .8rem 0;
    border-top: 1px solid var(--dim); border-bottom: 1px solid var(--dim);
  }
  .sv-selftest__title {
    margin: 0 0 .3rem; font-family: var(--font-identity); font-size: .72rem;
    text-transform: uppercase; letter-spacing: .1em; color: var(--text);
  }
  .sv-selftest__what { margin: 0 0 .6rem; font-size: .78rem; color: var(--dim-text); max-width: 78ch; }
  .sv-selftest__rows { display: grid; gap: .25rem; }
  .sv-selftest__row { display: flex; gap: .6rem; align-items: baseline; font-size: .8rem; }
  .sv-selftest__label { color: var(--dim-text); }
  .sv-selftest__row[data-disagrees="true"] .sv-selftest__label { color: var(--red); }
  .sv-selftest__verdict { margin: .6rem 0 0; font-size: .78rem; color: var(--text); }
  .sv-selftest__verdict[data-agreed="3"] { color: var(--dim-text); }

  .sv-groups { display: grid; gap: 1.5rem; }
  .sv-group__head {
    position: sticky; top: calc(var(--tab-h) + var(--nav-h)); z-index: 1;
    background: var(--bg); padding: .35rem 0 .4rem;
    display: flex; gap: .6rem; align-items: baseline;
    border-bottom: 1px solid var(--dim);
  }
  .sv-group__title {
    margin: 0; font-family: var(--font-identity); font-size: .72rem;
    text-transform: uppercase; letter-spacing: .1em; color: var(--text);
  }
  .sv-group__count { margin: 0; font-size: .7rem; color: var(--dim); font-variant-numeric: tabular-nums; }
  .sv-group__rows { display: grid; }

  .sv-row { border-bottom: 1px solid var(--dim); }
  .sv-row__head {
    display: flex; gap: .6rem; align-items: baseline;
    padding: .4rem 0; cursor: pointer; list-style: none;
  }
  .sv-row__head::-webkit-details-marker { display: none; }
  .sv-row__head:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .sv-row__name { font-size: .82rem; color: var(--dim-text); }
  .sv-row[data-verdict="held"] .sv-row__name { color: var(--text); }
  .sv-row[data-verdict="broke"] .sv-row__name,
  .sv-row[data-verdict="no teeth"] .sv-row__name { color: var(--text); font-weight: 600; }
  .sv-row__body { padding: .2rem 0 .9rem 6.1rem; }

  .sv-inputs { margin: 0 0 .6rem; display: grid; grid-template-columns: 5rem 1fr; gap: .2rem .8rem; }
  .sv-inputs__term {
    font-family: var(--font-identity); font-size: .6rem;
    text-transform: uppercase; letter-spacing: .08em; color: var(--dim);
  }
  .sv-inputs__value {
    margin: 0; font-size: .74rem; color: var(--dim-text);
    overflow-wrap: anywhere;
  }
  .sv-inputs__value--counterexample { color: var(--violet); }

  .sv-run { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .4rem; }
  .sv-run__button {
    font: inherit; font-size: .72rem; color: var(--text);
    background: var(--card2); border: 1px solid var(--dim);
    border-radius: 3px; padding: .25rem .6rem; cursor: pointer;
  }
  @media (hover: hover) and (pointer: fine) {
    .sv-run__button:hover { border-color: var(--dim-text); }
  }
  .sv-run__button:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
  .sv-run__result { margin: 0; font-size: .74rem; color: var(--dim); max-width: 78ch; }
  .sv-run__result--expected { color: var(--dim-text); }
  .sv-run__result--surprising { color: var(--red); }

  /* Typography roles (Typography.fs). Chakra Petch — the identity face — carries
     data, labels, badges and headers; DM Sans (the body default) carries team
     names and prose. Weight/size/tracking stay per-element; this assigns the
     face, and tabular numerals to the numeric roles so columns do not jitter. */
  h1,
  .desk-card__header, .sport-group__title, .st-card__title, .st-row__label,
  .desk-card__brief-kind, .desk-card__flip-hint, .pk-legend,
  .pk-chip, .desk-card__verdict,
  #viewed-date, .briefs-stat__value {
    font-family: var(--font-identity);
  }
  /* THE SCORE LEFT THE IDENTITY GROUP on 2026-10-08, and it is the only member
     that did. Chakra Petch ships static instances only — no `wght` axis — so a
     score set in it cannot vary its weight at all. DM Sans Variable carries
     `wght 100 1000`, and --font-score comes from Typography's `Score` role.
     #viewed-date and .briefs-stat__value stay on the identity face: they are
     `Data`, which did not move. */
  .desk-card__score {
    font-family: var(--font-score);
  }
  .desk-card__score, #viewed-date, .briefs-stat__value {
    font-variant-numeric: tabular-nums;
  }

  /* METRICS TAB (src/MetricsView.fs). Geometry and opacity carry each reading.
     A Flow cell is a short bar, and its fill opacity is Flow.pulseStyle's: a
     minute with no InFlow reading has no fill. A Gravity mark's fill is
     --mx-fill from Gravity.encodeWell, and its shape class is the well's shape.
     An unencoded receiver is a dashed outline with no fill, so it cannot be read
     as a receiver who drew nothing (a solid outline at zero fill). */
  .mx-panel { max-width: 100%; }
  .mx-provenance { font-size: .72rem; color: var(--dim-text); max-width: 70ch; }
  .mx-provenance--top { margin: 0 0 1rem; }
  .mx-section { margin: 0 0 1rem; padding: .5rem .7rem; background: var(--card2); }
  .mx-title { cursor: pointer; font-weight: 600; }
  .mx-stated { font-size: .8rem; max-width: 70ch; }
  .mx-error { font-size: .8rem; color: var(--caution); }
  .mx-flow-subject h4 { font-size: .8rem; margin: .6rem 0 .3rem; }
  .mx-flow-strip { display: flex; align-items: center; gap: 1px; margin: .15rem 0; }
  .mx-flow-side { font-size: .7rem; width: 3rem; color: var(--dim-text); }
  .mx-flow-cell { display: inline-block; width: 4px; height: 14px; background: var(--discovery); opacity: 0; outline: 1px solid var(--edge-strong); outline-offset: -1px; }
  .mx-flow-cell--nowitness { width: 60px; opacity: 1; background: none; outline-style: dashed; }
  .mx-play { display: flex; align-items: center; gap: .35rem; margin: .2rem 0; flex-wrap: wrap; }
  .mx-play-id { font-size: .7rem; color: var(--dim-text); width: 12rem; }
  .mx-well { --mx-fill: 0; position: relative; display: inline-block; width: 16px; height: 16px; border: 1px solid var(--text); }
  .mx-well::after { content: ""; position: absolute; inset: 2px; background: var(--discovery); opacity: var(--mx-fill); }
  .mx-well[data-well="expanding"] { border-radius: 50%; }
  .mx-well[data-well="steady"] { border-radius: 2px; }
  .mx-well[data-well="contracting"] { transform: rotate(45deg) scale(.8); }
  .mx-well[data-well="unencoded"] { border-style: dashed; border-color: var(--dim-text); }
</style>
</head>
<body>
  <h1>FIELD Laboratory — desk scoreboard</h1>

  <!-- Wired by Program.fs (wireTabs). Roving arrow-key selection per the
       WAI-ARIA tabs pattern; the panels are real tabpanels, not divs that get
       display:none, so a screen reader is told what changed. -->
  <div class="tabs" role="tablist" aria-label="Laboratory surfaces">
    <button role="tab" id="tab-scoreboard" aria-controls="panel-scoreboard" aria-selected="true" tabindex="0">Scoreboard</button>
    <button role="tab" id="tab-field-pick" aria-controls="panel-field-pick" aria-selected="false" tabindex="-1">Field's Pick</button>
    <button role="tab" id="tab-scout-pick" aria-controls="panel-scout-pick" aria-selected="false" tabindex="-1">Scout's Pick</button>
    <button role="tab" id="tab-pickem" aria-controls="panel-pickem" aria-selected="false" tabindex="-1">Pick'em</button>
    <button role="tab" id="tab-weather" aria-controls="panel-weather" aria-selected="false" tabindex="-1">Weather</button>
    <button role="tab" id="tab-stats" aria-controls="panel-stats" aria-selected="false" tabindex="-1">Stats</button>
    <button role="tab" id="tab-lineups" aria-controls="panel-lineups" aria-selected="false" tabindex="-1">Lineups</button>
    <button role="tab" id="tab-briefs" aria-controls="panel-briefs" aria-selected="false" tabindex="-1">Briefs</button>
    <button role="tab" id="tab-draw" aria-controls="panel-draw" aria-selected="false" tabindex="-1">Draw</button>
    <button role="tab" id="tab-metrics" aria-controls="panel-metrics" aria-selected="false" tabindex="-1">Metrics</button>
    <button role="tab" id="tab-verify" aria-controls="panel-verify" aria-selected="false" tabindex="-1">Verify</button>
  </div>

  <!-- Wired by Program.fs (wireDateNav). Navigation rewrites the URL with
       history.pushState and re-renders in place, so every day is linkable and
       the back button works. -->
  <nav class="datenav" aria-label="Slate date">
    <button id="prev-day" type="button" aria-label="Previous day">←</button>
    <!-- LIVE. Program.fs `report "viewed-date"` writes here, and pressing an
         arrow re-renders the entire slate below without moving focus — the one
         case on this page where content changes and nothing tells a screen
         reader. The tabs need no live region: aria-selected plus a real
         tabpanel already announce, and focus follows the arrow keys.
         aria-atomic because the date is one fact, not a stream of edits. -->
    <time id="viewed-date" aria-live="polite" aria-atomic="true"></time>
    <button id="next-day" type="button" aria-label="Next day">→</button>
    <button id="today" type="button">Today</button>
  </nav>

  <div class="meta">
    <!-- role=status, because this line is the answer to "does the page have
         data at all". A fetch failure that is only visible is half a fix, by
         the same argument that made #viewed-date a live region. Polite, not
         assertive: it must not interrupt. -->
    <div id="decode-status" role="status">decoding…</div>
    <div id="units-demo"></div>
    <!-- What the MLB schedule fetch did. `report` writes by element id, so an id
         nothing renders is a silent no-op — which is how a status line comes to
         report nothing while looking like it reports something. -->
    <div id="schedule"></div>
  </div>
  <div role="tabpanel" id="panel-scoreboard" aria-labelledby="tab-scoreboard" tabindex="0">
    <div id="desk"></div>
  </div>
  <div role="tabpanel" id="panel-field-pick" aria-labelledby="tab-field-pick" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-scout-pick" aria-labelledby="tab-scout-pick" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-pickem" aria-labelledby="tab-pickem" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-weather" aria-labelledby="tab-weather" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-stats" aria-labelledby="tab-stats" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-briefs" aria-labelledby="tab-briefs" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-lineups" aria-labelledby="tab-lineups" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-draw" aria-labelledby="tab-draw" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-metrics" aria-labelledby="tab-metrics" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-verify" aria-labelledby="tab-verify" tabindex="0" hidden></div>

  <!-- Fable emits bare module specifiers for npm packages — `import {
       createSignal } from "solid-js"` — which browsers cannot resolve natively.
       An import map fixes that without introducing a bundler.

       vendor/solid.js is placed by scripts/build-site.mjs, which copies
       solid-js's BROWSER build specifically. The package's `module` field points
       at dist/server.js, the SSR renderer; dist/solid.js is reachable only
       through the "browser" export condition, which a plain <script
       type="module"> does not apply. Vendoring the wrong one yields a page with
       no reactivity and no error. -->
  <script type="importmap">
  {
    "imports": {
      "solid-js": "./vendor/solid.js"
    }
  }
  </script>

  <script type="module" src="./build/Program.js"></script>
</body>
</html>
