<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIELD Laboratory — desk scoreboard</title>
<!-- Suppresses the browser's automatic /favicon.ico request, which would
     otherwise be the only 404 in the render check. -->
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    /* The sport headings stick directly beneath the date bar, so the two
       offsets must agree exactly. Derived from one variable rather than
       eyeballed: a hand-tuned `top` that is 3px short of the bar's real height
       leaves a sliver of card content scrolling through the seam, which is
       precisely what the first attempt did. */
    --nav-h: 3.25rem;
    /* The tab bar sits above the date nav, so every sticky offset below is
       derived from BOTH heights rather than eyeballed. The 3px seam this
       repo already shipped once came from a hand-tuned `top`; adding a second
       sticky layer is exactly where that recurs. */
    --tab-h: 3rem;
    --bg: #0f1115;
  }
  body {
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    margin: 0; padding: 2rem; background: #0f1115; color: #e6e8ec;
  }
  h1 { font-size: 1.1rem; letter-spacing: .04em; text-transform: uppercase; opacity: .6; margin: 0 0 1.5rem; }
  .meta { font-size: .85rem; opacity: .65; margin-bottom: 1.5rem; }
  .meta div { margin-bottom: .25rem; }

  /* Tabs. Three surfaces over the same date: the slate, and the two picks —
     which are not the same feature and must not look like one. */
  .tabs {
    position: sticky; top: 0; z-index: 3;
    display: flex; gap: .25rem;
    height: var(--tab-h); box-sizing: border-box; align-items: stretch;
    margin: 0; background: var(--bg);
    border-bottom: 1px solid #262a33;
  }
  .tabs button {
    font: inherit; font-size: .8rem; letter-spacing: .04em;
    color: #8a90a0; background: none;
    border: none; border-bottom: 2px solid transparent;
    padding: 0 .9rem; cursor: pointer;
  }
  .tabs button:hover { color: #e6e8ec; }
  .tabs button[aria-selected="true"] { color: #e6e8ec; border-bottom-color: #4a9d7e; }
  /* Focus must stay visible: a tablist is keyboard-driven by design, and the
     arrow-key pattern is unusable if focus is invisible. */
  .tabs button:focus-visible { outline: 2px solid #4a9d7e; outline-offset: -2px; }
  [role="tabpanel"][hidden] { display: none; }

  .pick-panel { max-width: 46rem; }
  .pick-panel h2 { font-size: .95rem; margin: 0 0 .35rem; }
  .pick-panel__what { font-size: .82rem; opacity: .65; margin: 0 0 1.25rem; }
  .pick-leader {
    border: 1px solid #262a33; border-left: 3px solid #4a9d7e; border-radius: 10px;
    padding: .9rem 1rem; margin-bottom: 1rem; background: #12151b;
  }
  .pick-leader__matchup { font-size: 1.05rem; margin-bottom: .3rem; }
  .pick-leader__tie { font-size: .8rem; color: #d8a657; margin-bottom: .5rem; }
  .pick-reasons { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
  .pick-reason {
    font-size: .74rem; padding: .2rem .5rem; border-radius: 999px;
    background: #1a1f27; border: 1px solid #2a303b; color: #b9c0cd;
  }
  .pick-brief { font-size: .88rem; margin-top: .6rem; opacity: .85; }
  .pick-chaser {
    display: flex; justify-content: space-between; gap: 1rem;
    padding: .5rem 0; border-bottom: 1px solid #1c2027; font-size: .86rem;
  }
  .pick-chaser__reasons { font-size: .74rem; opacity: .6; text-align: right; }
  .gate { padding: .5rem 0; border-bottom: 1px solid #1c2027; font-size: .84rem; }
  .gate__name { color: #b9c0cd; }
  .gate__answer { font-size: .78rem; opacity: .7; }
  .gate--qualifies .gate__name { color: #4a9d7e; }
  .gate--unanswerable .gate__name { color: #d8a657; }
  .pick-empty { font-size: .88rem; opacity: .7; }

  /* Drama sparkline. 30 bars on a fixed 0-100 domain, so a bar's height in
     percent IS the drama value — no scale factor, and no series maximum
     anywhere in the CSS or the F#. */
  .spark { margin-top: .6rem; }
  .spark__row {
    /* 44px, the GLYPH minimum. The production version used 24px, at which a
       30-point spread is about seven pixels and every card looks the same. */
    height: 44px;
    display: flex; align-items: flex-end; gap: 1px;
  }
  .spark__bar {
    flex: 1 1 0; min-width: 0;
    background: #2f6b52;
    border-radius: 1px 1px 0 0;
  }
  .spark__caption {
    font-size: .7rem; opacity: .55; margin-top: .3rem;
    font-variant-numeric: tabular-nums;
  }

  /* Pick'em. */
  .pk-banner {
    border: 1px solid #262a33; border-radius: 10px;
    padding: .8rem 1rem; margin-bottom: 1rem;
    background: #12151b; font-size: .92rem;
  }
  .pk-sports { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: .5rem; }
  .pk-sport {
    font: inherit; font-size: .78rem;
    display: inline-flex; align-items: center; gap: .4rem;
    color: #8a90a0; background: #12151b;
    border: 1px solid #262a33; border-radius: 8px;
    padding: .3rem .6rem; cursor: pointer;
  }
  .pk-sport--on { color: #e6e8ec; background: #1d212a; border-color: #3a4150; }
  .pk-sport:focus-visible { outline: 2px solid #4a9d7e; outline-offset: -2px; }
  .pk-sport__count { opacity: .6; font-variant-numeric: tabular-nums; }
  .pk-legend { font-size: .74rem; opacity: .5; margin: 0 0 1rem; }

  /* Fixed tracks, not flex. On the production screen a row with two long team
     names ("Rockies @ Diamondbacks") pushed its status chip onto a second line
     while every other row kept it inline — the chip was what gave way when the
     names overflowed. A grid gives the chip its own column, so the longest
     fixture on the slate cannot break the row it appears in. The matchup cell
     is the one allowed to shrink, and it truncates instead. */
  .pk-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto 5.5rem;
    align-items: center; gap: .75rem;
    padding: .6rem 0; border-bottom: 1px solid #1c2027;
  }
  .pk-row__matchup { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pk-row__sides { display: flex; gap: .4rem; }
  .pk-side {
    font: inherit; font-size: .82rem;
    color: #8a90a0; background: #12151b;
    border: 1px solid #262a33; border-radius: 8px;
    padding: .35rem .7rem; cursor: pointer; white-space: nowrap;
  }
  .pk-side:hover { color: #e6e8ec; border-color: #343a46; }
  .pk-side--chosen { color: #7fd1ab; border-color: #2f6b52; background: #14211b; }
  .pk-side:focus-visible { outline: 2px solid #4a9d7e; outline-offset: -2px; }
  .pk-chip {
    font-size: .68rem; letter-spacing: .06em; text-align: center;
    padding: .25rem .4rem; border-radius: 6px; white-space: nowrap;
  }
  .pk-chip--none    { color: #5c6472; background: #14171d; }
  .pk-chip--pending { color: #d8a657; background: #2a2113; }
  .pk-chip--live    { color: #7fb3d1; background: #13212a; }
  .pk-chip--drawn   { color: #9aa0ad; background: #1a1d23; }
  .pk-chip--right   { color: #7fd1ab; background: #14211b; }
  .pk-chip--wrong   { color: #d18f8f; background: #2a1616; }

  /* Narrow screens: let the row become two lines DELIBERATELY, all rows at
     once, rather than only the row that happens to have long names. */
  @media (max-width: 34rem) {
    .pk-row { grid-template-columns: minmax(0, 1fr) 5.5rem; }
    .pk-row__sides { grid-column: 1 / -1; }
  }

  /* Date navigation. Sticky because a full multi-sport slate is long and the
     controls are useless if you have to scroll back to the top to reach them. */
  .datenav {
    position: sticky; top: var(--tab-h); z-index: 2;
    display: flex; align-items: center; gap: .6rem;
    height: var(--nav-h); box-sizing: border-box;
    margin: 0 0 1.5rem;
    background: var(--bg);
    border-bottom: 1px solid #262a33;
  }
  .datenav button {
    font: inherit; font-size: .8rem;
    color: #e6e8ec; background: #161920;
    border: 1px solid #262a33; border-radius: 8px;
    padding: .35rem .7rem; cursor: pointer;
  }
  .datenav button:hover:not([disabled]) { background: #1d212a; border-color: #343a46; }
  /* Pinning to a committed capture disables navigation — the capture is one
     fixed day, so stepping off it would silently show a different date's data
     under a URL that claims to be pinned. Disabled controls say so visually. */
  .datenav button[disabled] { opacity: .35; cursor: not-allowed; }
  #viewed-date {
    font-variant-numeric: tabular-nums; letter-spacing: .04em;
    font-size: .9rem; opacity: .8; min-width: 10ch;
  }

  /* The slate stacks sport sections vertically; the grid now lives on each
     section's own grid, not on #desk, or the section headings would be laid
     out as grid cells alongside the cards. */
  #desk { display: block; }
  .sport-group { margin: 0 0 2rem; }
  /* Sticky so the sport stays identifiable while scrolling a long section.
     Opaque background and a full-bleed rule are load-bearing, not decoration:
     a sticky heading floats OVER the cards, so a transparent or partial
     background lets card text render through it. */
  .sport-group__title {
    position: sticky; top: calc(var(--tab-h) + var(--nav-h)); z-index: 1;
    font-size: .78rem; text-transform: uppercase; letter-spacing: .08em;
    font-weight: 600; color: #8a90a0; margin: 0 0 .75rem;
    padding: .55rem 0; background: var(--bg);
    box-shadow: 0 -1px 0 var(--bg), 0 1px 0 #21252e;
  }
  .sport-group__grid {
    display: grid; gap: 1rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  }
  .desk-card {
    border: 1px solid #262a33; border-radius: 10px; padding: 1rem 1.1rem; background: #161920;
  }
  .desk-card__header { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; opacity: .5; }
  .desk-card__teams { font-weight: 600; margin: .4rem 0 .1rem; }
  .desk-card__score { font-size: 2rem; font-variant-numeric: tabular-nums; font-weight: 700; }
  .desk-card__status { font-size: .8rem; opacity: .75; }
  .desk-card__drama, .desk-card__odds { font-size: .75rem; opacity: .55; margin-top: .3rem; }
  .desk-card__wx { font-size: .75rem; opacity: .7; margin-top: .3rem; }

  /* --- The brief flip -----------------------------------------------------
     A card with a joined brief turns to reveal the prose. Only flippable cards
     get any of this; a plain card is untouched and keeps its old box exactly.

     THIS CSS WAS LOST ONCE. Stage 1 added it to public/index.html — which is
     gitignored build output that `scripts/build-site.mjs` overwrites from THIS
     file on every build. So the flip shipped behaviourally correct and visually
     unstyled: the behaviour is F#, the look is here, and editing the copy
     instead of the source dropped the look. The source is index.html at the
     repo root; public/ is generated.

     Height: the two faces share one grid cell, so the flip container is always
     as tall as the TALLER face and a multi-sentence brief is never clipped. A
     fixed-height 3D flip would have had to crop the prose or pad every
     scoreline; the grid-stack sizes to content and still flips in 3D. */
  .desk-card--flippable { cursor: pointer; perspective: 1000px; }
  .desk-card--flippable:focus-visible { outline: 2px solid #4a9d7e; outline-offset: 2px; }
  .desk-card__flip {
    display: grid; transition: transform .5s ease; transform-style: preserve-3d;
  }
  .desk-card__flip > * { grid-area: 1 / 1; backface-visibility: hidden; }
  .desk-card__brief { transform: rotateY(180deg); }
  .desk-card.is-flipped .desk-card__flip { transform: rotateY(180deg); }
  .desk-card__flip-hint {
    font-size: .7rem; letter-spacing: .04em; text-transform: uppercase;
    opacity: .5; margin-top: .5rem;
  }
  .desk-card__brief-kind {
    font-size: .7rem; text-transform: uppercase; letter-spacing: .06em;
    opacity: .5; margin-bottom: .4rem;
  }
  .desk-card__brief-text { margin: 0; font-size: .85rem; line-height: 1.45; }

  /* Stage 2: the scoreline verdict. Same colour vocabulary the pick'em chips
     use — green confirmed, red wrong, amber cannot-tell-yet. */
  .desk-card__verdict {
    margin-top: .6rem; font-size: .72rem; letter-spacing: .04em;
    padding: .2rem .5rem; border-radius: 6px; display: inline-block;
  }
  .desk-card__verdict--ok   { color: #7fd1ab; background: #14211b; }
  .desk-card__verdict--bad  { color: #d18f8f; background: #2a1616; }
  .desk-card__verdict--wait { color: #d8a657; background: #2a2113; }

  /* Stage 3: provenance and anchoring. Quiet metadata under the prose — the
     brief is the content, these are footnotes about where it came from and how
     well it anchors its numbers in time. */
  .desk-card__brief-prov, .desk-card__brief-fallback, .desk-card__brief-anchor {
    font-size: .7rem; opacity: .55; margin-top: .35rem; line-height: 1.35;
  }
  .desk-card__brief-prov { margin-top: .6rem; opacity: .65; }

  /* --- Stats and Weather panels ------------------------------------------
     These shipped with NO styling at all, so every game ran together as one
     column of text — the scoreboard had `.desk-card` and the two new panels
     had nothing. Both now use the same boundary the scoreboard already
     established: a border, a radius, a background one step off the page, and
     a real gap between siblings.

     The gap is what `separation-check.mjs` measures. A border alone does not
     separate anything if the boxes are flush. */
  .st-reports, .wx-rows {
    display: grid;
    gap: 1rem;
  }
  .st-card, .wx-row {
    border: 1px solid #262a33;
    border-radius: 10px;
    padding: 1rem 1.1rem;
    background: #161920;
  }
  .st-card__header {
    font-weight: 600; font-size: 1rem; margin-bottom: .15rem;
  }
  .st-card__title {
    font-size: .68rem; text-transform: uppercase; letter-spacing: .08em; opacity: .45;
    margin-bottom: .6rem;
  }
  .st-rows { display: grid; gap: .3rem; }
  .st-row { display: grid; grid-template-columns: 7.5rem 1fr auto; gap: .6rem; align-items: baseline; }
  .st-row__label { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; opacity: .45; }
  .st-row__value { font-size: .85rem; }
  /* An unresolved row is MARKED. Production renders a failed lookup as a bare
     name, which looks like a complete row. */
  .st-row--gap .st-row__value { opacity: .6; }
  .st-row__flag {
    font-size: .6rem; text-transform: uppercase; letter-spacing: .06em;
    color: #c9a227; border: 1px solid #4a3f16; border-radius: 999px; padding: .05rem .4rem;
  }
  .st-badge {
    display: inline-block; font-size: .68rem; margin-top: .4rem; padding: .1rem .5rem;
    border-radius: 999px; border: 1px solid #2f3542;
  }
  .st-badge--watch { color: #c9a227; border-color: #4a3f16; }
  .st-card__records { margin-top: .7rem; font-size: .85rem; font-variant-numeric: tabular-nums; }
  .st-card__comeback { margin-top: .15rem; font-size: .8rem; opacity: .75; }
  .st-card__gaps { margin-top: .6rem; font-size: .7rem; opacity: .5; }
  .st-panel__what, .wx-panel__what { font-size: .8rem; opacity: .6; max-width: 60ch; }

  .wx-row { display: grid; grid-template-columns: 1fr auto; gap: .3rem 1rem; }
  .wx-row__venue { font-weight: 600; font-size: .9rem; }
  .wx-row__conditions { font-size: .85rem; text-align: right; }
  .wx-row__roof { grid-column: 1 / -1; font-size: .7rem; opacity: .5; }
  .wx-verdict { font-size: .85rem; margin: .6rem 0 1rem; }
  .wx-error { color: #c9a227; }
  .wx-partial, .wx-unlocated { font-size: .7rem; opacity: .5; margin-top: .8rem; }
</style>
</head>
<body>
  <h1>FIELD Laboratory — desk scoreboard</h1>

  <!-- Wired by Program.fs (wireTabs). Roving arrow-key selection per the
       WAI-ARIA tabs pattern; the panels are real tabpanels, not divs that get
       display:none, so a screen reader is told what changed. -->
  <div class="tabs" role="tablist" aria-label="Laboratory surfaces">
    <button role="tab" id="tab-scoreboard" aria-controls="panel-scoreboard" aria-selected="true" tabindex="0">Scoreboard</button>
    <button role="tab" id="tab-field-pick" aria-controls="panel-field-pick" aria-selected="false" tabindex="-1">Field's Pick</button>
    <button role="tab" id="tab-scout-pick" aria-controls="panel-scout-pick" aria-selected="false" tabindex="-1">Scout's Pick</button>
    <button role="tab" id="tab-pickem" aria-controls="panel-pickem" aria-selected="false" tabindex="-1">Pick'em</button>
    <button role="tab" id="tab-weather" aria-controls="panel-weather" aria-selected="false" tabindex="-1">Weather</button>
    <button role="tab" id="tab-stats" aria-controls="panel-stats" aria-selected="false" tabindex="-1">Stats</button>
  </div>

  <!-- Wired by Program.fs (wireDateNav). Navigation rewrites the URL with
       history.pushState and re-renders in place, so every day is linkable and
       the back button works. -->
  <nav class="datenav" aria-label="Slate date">
    <button id="prev-day" type="button" aria-label="Previous day">←</button>
    <span id="viewed-date"></span>
    <button id="next-day" type="button" aria-label="Next day">→</button>
    <button id="today" type="button">Today</button>
  </nav>

  <div class="meta">
    <div id="decode-status">decoding…</div>
    <div id="units-demo"></div>
    <!-- What the MLB schedule fetch did. `report` writes by element id, so an id
         nothing renders is a silent no-op — which is how a status line comes to
         report nothing while looking like it reports something. -->
    <div id="schedule"></div>
  </div>
  <div role="tabpanel" id="panel-scoreboard" aria-labelledby="tab-scoreboard" tabindex="0">
    <div id="desk"></div>
  </div>
  <div role="tabpanel" id="panel-field-pick" aria-labelledby="tab-field-pick" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-scout-pick" aria-labelledby="tab-scout-pick" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-pickem" aria-labelledby="tab-pickem" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-weather" aria-labelledby="tab-weather" tabindex="0" hidden></div>
  <div role="tabpanel" id="panel-stats" aria-labelledby="tab-stats" tabindex="0" hidden></div>

  <!-- Fable emits bare module specifiers for npm packages — `import {
       createSignal } from "solid-js"` — which browsers cannot resolve natively.
       An import map fixes that without introducing a bundler.

       vendor/solid.js is placed by scripts/build-site.mjs, which copies
       solid-js's BROWSER build specifically. The package's `module` field points
       at dist/server.js, the SSR renderer; dist/solid.js is reachable only
       through the "browser" export condition, which a plain <script
       type="module"> does not apply. Vendoring the wrong one yields a page with
       no reactivity and no error. -->
  <script type="importmap">
  {
    "imports": {
      "solid-js": "./vendor/solid.js"
    }
  }
  </script>

  <script type="module" src="./build/Program.js"></script>
</body>
</html>
